name: Rovor Moho Restricted Read Queue

# Read-only. Source and request are retrieved from this exact pushed main SHA;
# no actions/checkout Node runtime needed on an older Intel Mac.
on:
  push:
    branches: [main]
    paths:
      - 'rovor-production/moho-queue/read-*.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: rovor-moho-readonly
  cancel-in-progress: false

jobs:
  read-moho:
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 3
    steps:
      - name: Read whitelisted Moho commands with Mac system Python
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,tempfile,urllib.parse,urllib.request
          repo="TeamRovor/rovor-video-engine"
          sha=os.environ["GITHUB_SHA"]
          token=os.environ["GH_TOKEN"]
          # Inspect GitHub's actual commit diff; push webhook head_commit
          # may omit added/modified arrays for API-created commits.
          prefix="rovor-production/moho-queue/read-"
          def github_get(url):
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=18) as resp:
                  return json.load(resp)
          commit=github_get("https://api.github.com/repos/"+repo+"/commits/"+sha)
          files=[item["filename"] for item in commit.get("files",[])
                 if item.get("status") in ("added","modified")
                 and item.get("filename","").startswith(prefix)
                 and item.get("filename","").endswith(".json")
                 and "/" not in item["filename"][len(prefix):]]
          if len(files)!=1:
              raise SystemExit("Expected exactly one approved read request in commit diff; found "+repr(files))
          def fetch(path):
              url=("https://api.github.com/repos/"+repo+"/contents/"
                  +urllib.parse.quote(path,safe="/")+"?ref="+urllib.parse.quote(sha))
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=18) as resp:
                  payload=json.load(resp)
              if payload.get("encoding")!="base64":
                  raise SystemExit("Unexpected GitHub file encoding")
              return base64.b64decode(payload["content"])
          client=fetch(".github/scripts/rovor_moho_read_queue.py")
          request=fetch(files[0])
          with tempfile.TemporaryDirectory(prefix="rovor-mcp-safe-read-") as work:
              wd=pathlib.Path(work)
              p=wd/".github/scripts/rovor_moho_read_queue.py"
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(client)
              q=wd/files[0]
              q.parent.mkdir(parents=True,exist_ok=True)
              q.write_bytes(request)
              child_env=os.environ.copy()
              child_env["ROVOR_REQUEST_PATH"]=files[0]
              code=subprocess.call(["/usr/bin/python3",str(p)],cwd=wd,env=child_env)
              raise SystemExit(code)
          PY
