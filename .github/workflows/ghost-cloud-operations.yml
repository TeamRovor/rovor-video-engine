name: Private HUD cloud operations checks
on:
  push:
    branches: [main]
    paths: ['integrations/ghost-cloud/**', 'tests/test_ghost_cloud_operations.mjs', 'tests/test_ghost_cloud.mjs', 'tests/test_ghost_cloud_canary_preflight.mjs', 'dashboard/command-center/native-v8-9/live-quota-board.js', 'tests/test_hud_verified_quota.mjs', '.github/workflows/ghost-cloud-operations.yml']
  pull_request:
    paths: ['integrations/ghost-cloud/**', 'tests/test_ghost_cloud_operations.mjs', 'tests/test_ghost_cloud.mjs', 'tests/test_ghost_cloud_canary_preflight.mjs', 'dashboard/command-center/native-v8-9/live-quota-board.js', 'tests/test_hud_verified_quota.mjs', '.github/workflows/ghost-cloud-operations.yml']
concurrency:
  group: ghost-cloud-operations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_ghost_cloud_operations.mjs tests/test_ghost_cloud.mjs tests/test_ghost_cloud_canary_preflight.mjs tests/test_ghost_cloud_site_upgrade.mjs
      - run: node --test tests/test_hud_verified_quota.mjs
      - run: python3 tools/project_loop.py check
      - run: python3 tools/task_routing_pair.py --check
