name: RUN GUS ONCE - Gemini cloud pilot

# This is a separate single-purpose button for the existing Cloudflare HUD.
# There is NO 'Action' dropdown. A checked owner authorization and clicking
# Run workflow authorizes exactly one NEW immutable v2 task; STOP is restored.
# Do not enable the recurring schedule or replay historical jobs.
on:
  workflow_dispatch:
    inputs:
      approve_one_gus_job:
        description: "I authorize ONE real free-tier-attested Gemini Gus draft for my private PASS/FAIL review"
        type: boolean
        required: true
        default: false
  pull_request:
    paths:
      - '.github/workflows/run-gus-once.yml'
      - 'tests/test_hud_run_gus_once.mjs'
      - 'tools/cloud_gemini_workforce_control.mjs'
      - 'integrations/hud-cloud/approved-workforce.mjs'
      - 'tests/test_hud_cloud_workforce.mjs'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify one-shot identity, immutable receipts, STOP and owner controls
        run: |
          node --check tools/cloud_gemini_workforce_control.mjs
          node --check integrations/hud-cloud/approved-workforce.mjs
          node --test tests/test_hud_run_gus_once.mjs tests/test_hud_cloud_workforce.mjs tests/test_ghost_cloud_feed.mjs

  owner-approved-gus-pilot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: rovor-hud-production
    concurrency:
      group: rovor-gemini-workforce-owner-control
      cancel-in-progress: false
    env:
      ROVOR_HUD_READER_TOKEN: ${{ secrets.ROVOR_HUD_READER_TOKEN }}
      ROVOR_HUD_WRITER_TOKEN: ${{ secrets.ROVOR_HUD_WRITER_TOKEN }}
      ROVOR_WORKFORCE_ACTION: pilot_once
      ROVOR_WORKFORCE_TASK_ID: cloud-gemini-website-offer-pilot-20261110
      ROVOR_WORKFORCE_REVISION: v2
      ROVOR_OWNER_CONFIRMS_NEW_TASK: ${{ inputs.approve_one_gus_job }}
    steps:
      - name: Require checked owner approval before any model request
        run: |
          if [ "${ROVOR_OWNER_CONFIRMS_NEW_TASK}" != "true" ]; then
            echo "::error title=Owner approval required::Check the approval box to run one bounded Gus draft."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute one canonical Gus v2 pilot and restore STOP; no replay
        run: node tools/cloud_gemini_workforce_control.mjs
