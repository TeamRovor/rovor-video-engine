name: ROVOR visible wall paint non-Moho render

on:
  push:
    branches: [feature/nonmoho-visible-paint-trail-v1]
    paths:
      - 'evan-engine/directed_paint.py'
      - 'evan-engine/directed_scene.py'
      - 'evan-engine/test_directed_paint.py'
      - '.github/workflows/nonmoho-paint-trail.yml'
  pull_request:
    paths:
      - 'evan-engine/directed_paint.py'
      - 'evan-engine/directed_scene.py'
      - 'evan-engine/test_directed_paint.py'
      - '.github/workflows/nonmoho-paint-trail.yml'

permissions:
  contents: read

concurrency:
  group: visible-paint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-art-raster:
    name: Actual cumulative pixels at 1080p60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image test dependencies
        run: python -m pip install pillow==10.4.0 numpy==1.26.4
      - name: Test actual rendered wall pixels, contact and legacy scenes
        working-directory: evan-engine
        run: |
          python -m py_compile directed_paint.py directed_scene.py test_directed_paint.py
          python -m unittest -v test_directed_paint test_directed_contact_lock test_directed_contact test_directed_scene
