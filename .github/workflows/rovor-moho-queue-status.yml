name: Rovor Moho Queue Independent Status

# GitHub-hosted status observer; does not execute anything on user's Mac.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rovor-moho-queue-status.yml'
  workflow_dispatch:

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report Moho read-queue statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse
          root="https://api.github.com/repos/TeamRovor/rovor-video-engine"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=12) as r:
                  return json.load(r)
          lines=["### Independent Actions status observer","This job runs on GitHub-hosted Linux, **not** on the Mac. It cannot test Moho directly."]
          for wf in ["rovor-moho-read-queue.yml","moho-bridge-forensics-auto.yml"]:
              lines.append("#### "+wf)
              try:
                  url=root+"/actions/workflows/"+wf+"/runs?per_page=8"
                  runs=get(url).get("workflow_runs",[])
                  if not runs: lines.append("- No workflow runs found")
                  for run in runs:
                      lines.append("- Run ["+str(run.get("id"))+"]("+str(run.get("html_url"))+
                                   "): status **"+str(run.get("status"))+"**, conclusion **"+
                                   str(run.get("conclusion"))+"**, SHA "+
                                   str(run.get("head_sha",""))[:12])
              except Exception as exc:
                  lines.append("- Unable to read status: "+type(exc).__name__+": "+str(exc)[:110])
          body="\n".join(lines)[:6500]
          request=urllib.request.Request(root+"/issues/6/comments",
             data=json.dumps({"body":body}).encode(),
             headers=dict(headers,**{"Content-Type":"application/json"}),
             method="POST")
          with urllib.request.urlopen(request,timeout=12) as resp:
              print("Posted Moho workflow-status report to issue #6; HTTP",resp.status)
          print(body)
          PY
