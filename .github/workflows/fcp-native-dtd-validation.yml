name: Real FCPXML 1.13 DTD validation for native import

on:
  pull_request:
    paths:
      - 'tools/fcp_native_import_candidate.py'
      - 'tools/fcp_native_auto_import.py'
      - 'tools/fcp_jane_ui_probe.py'
      - 'tools/fcp_jane_library_bootstrap.py'
      - '.github/workflows/fcp-native-dtd-validation.yml'
  push:
    branches: [main]
    paths:
      - 'tools/fcp_native_import_candidate.py'
      - '.github/workflows/fcp-native-dtd-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-mirror-dtd:
    runs-on: macos-15-intel
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Jane's read-only Final Cut GUI AppleScript (NO launch)
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          python3 - "$WORK" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from fcp_jane_ui_probe import READ_ONLY_GUI_APPLESCRIPT
          Path(sys.argv[1], 'jane-ui.applescript').write_text(READ_ONLY_GUI_APPLESCRIPT)
          PY
          osacompile -o "$WORK/jane-ui.scpt" "$WORK/jane-ui.applescript"
          python3 - "$WORK" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from fcp_jane_library_bootstrap import APPLE_SCRIPT
          Path(sys.argv[1], 'jane-library.applescript').write_text(APPLE_SCRIPT)
          PY
          osacompile -o "$WORK/jane-library.scpt" "$WORK/jane-library.applescript"
          echo 'PASS: native library bootstrap compiled on macOS; nothing executed.'
          echo 'PASS: Jane GUI inspection AppleScript compiled on macOS, NOT executed.'
      - name: Validate real generated 30-second XML against Apple FCPXML 1.13 DTD mirror
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          command -v xmllint
          curl -fL --retry 2 --max-time 120 \
            'https://raw.githubusercontent.com/andrewarrow/cutlass/main/FCPXMLv1_13.dtd' \
            -o "$WORK/FCPXMLv1_13.dtd"
          shasum -a 256 "$WORK/FCPXMLv1_13.dtd"
          python3 - "$WORK" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from fcp_native_import_candidate import create_candidate
          p = Path(sys.argv[1])
          for label,w,h in [('landscape',1920,1080),('portrait',1080,1920)]:
              create_candidate(p / (label + '.fcpxml'),w,h,label)
          PY
          for kind in landscape portrait; do
            echo "Real 1.13 DTD validating $kind..."
            xmllint --nonet --noout --dtdvalid "$WORK/FCPXMLv1_13.dtd" "$WORK/$kind.fcpxml"
          done
          echo 'PASS: real public Apple v1.13 DTD mirror accepted BOTH generated 30s 60fps FCPXML files.'
          echo 'Verifying DTD byte identity with the user Mac-installed DTD hash...'
          echo '5afbc7ca1001bbc2190fb3b21d4d440ce061d94f5a5f583074e982b4745cd04d' \
            | diff -u - <(shasum -a 256 "$WORK/FCPXMLv1_13.dtd" | awk '{print $1}')
          export ROVOR_NATIVE_CI_DTD="$WORK/FCPXMLv1_13.dtd"
          export ROVOR_NATIVE_CI_ROOT="$WORK"
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          from unittest import mock
          sys.path.insert(0,'tools')
          import fcp_native_import_candidate as native
          root=Path(os.environ['ROVOR_NATIVE_CI_ROOT'])
          stage=root/'verified-stage'
          stage.mkdir()
          project=stage/'project'
          project.mkdir()
          fixtures=project/'fixtures'
          fixtures.mkdir()
          output=root/'native-output'
          with mock.patch.object(native,'validate_stage',
                                 return_value=(stage,project,fixtures)):
              receipt=native.prepare(stage,output,Path(os.environ['ROVOR_NATIVE_CI_DTD']))
          assert receipt['status']=='candidate_prepared_native_not_imported',receipt
          assert receipt['native_final_cut_operated'] is False
          assert receipt['native_final_cut_import_verified'] is False
          assert receipt['referenced_media_files'] == 0
          assert len(receipt['fcpxml_sha256']) == 2
          assert len(list(output.glob('*.fcpxml')))==2
          print('PASS: actual full native candidate preparation and installed-equivalent DTD validation.')
          import fcp_native_auto_import as automatic
          # Python home must point into this isolated CI root: no app launched,
          # no personal user data and no native Final Cut presence assumed.
          fake_home = root/'sandbox-home'
          rovor_dir = fake_home/'Documents'/'Rovor'
          rovor_dir.mkdir(parents=True)
          candidate_copy = rovor_dir/'candidates'
          import shutil
          shutil.copytree(output,candidate_copy)
          auto_output = rovor_dir/'automated'
          with mock.patch.object(automatic.Path,'home',return_value=fake_home):
              auto_receipt=automatic.prepare(candidate_copy,auto_output,
                                             Path(os.environ['ROVOR_NATIVE_CI_DTD']))
          assert auto_receipt['status']=='ready_to_dispatch_not_launched',auto_receipt
          assert not Path(auto_receipt['target_library']).exists()
          assert auto_receipt['native_timeline_verified'] is False
          assert auto_receipt['apple_event_sent'] is False
          for label in ('landscape','portrait'):
              assert (auto_output/(label+'-auto.fcpxml')).exists()
          print('PASS: real installed-identical DTD accepts BOTH Apple event auto-targeted XML files; no app launched.')
          PY
          echo 'This does NOT yet prove equivalence with the user-installed Apple DTD, or native app import.'
