name: GitHub-owned PRIVATE ROVOR HUD (Cloudflare Worker)
on:
  pull_request:
    paths:
      - 'integrations/hud-cloud/**'
      - 'dashboard/command-center/native-v8-9/**'
      - 'tests/test_hud_cloud.mjs'
      - 'tests/test_hud_github_deployment.mjs'
      - 'tests/test_hud_cloud_chat.mjs'
      - 'tests/test_hud_cloud_workforce.mjs'
      - 'tests/test_hud_mobile_drawer_stability.mjs'
      - 'tests/test_hud_private_review_page.mjs'
      - 'tests/test_hud_omniroute_relay.mjs'
      - 'tests/test_hud_chat_mobile.mjs'
      - 'tests/test_hud_repo_context.mjs'
      - 'tools/hud_repo_context.mjs'
      - 'tests/test_hud_chat_browser.cjs'
      - 'tests/test_hud_review_browser.cjs'
      - 'tools/hud_chat_relay_client.mjs'
      - 'tests/test_hud_ios_quota_rings.mjs'
      - 'tests/test_hud_provider_overview_layout.cjs'
      - 'tests/test_hud_gemini_project_quota.mjs'
      - 'integrations/hud-cloud/cloud-gemini-chat.mjs'
      - 'integrations/hud-cloud/verify-cloud-gemini.mjs'
      - 'integrations/hud-cloud/verify-live-gemini-catalog.mjs'
      - 'integrations/hud-cloud/private-worker-secret-payload.mjs'
      - 'tests/test_hud_gemini_key_activation.mjs'
      - 'tests/test_hud_live_gemini_catalog.mjs'
      - 'tests/test_hud_cloud_gemini.mjs'
      - 'tests/test_hud_gemini_coverage_workflow.mjs'
      - '.github/workflows/verify-gemini-model-coverage.yml'
      - 'tests/test_hud_groq_cloud.mjs'
      - 'tests/test_hud_groq_quota.mjs'
      - 'tests/test_hud_groq_key_probe.mjs'
      - 'tests/test_hud_idea_inbox.mjs'
      - 'tests/test_hud_discovery_inbox.mjs'
      - 'tests/test_hud_repo_source_cloud.mjs'
      - 'tests/test_hud_omniroute_chat_relay.mjs'
      - 'tools/activate_hud_gemini_route.mjs'
      - 'tools/verify_hud_gemini_activation.mjs'
      - 'tests/test_hud_gemini_activation_workflow.mjs'
      - '.github/workflows/connect-google-gemini-hud.yml'
      - 'tools/hud_chat.mjs'
      - 'tools/manage_hud_telemetry_agent.sh'
      - '.github/workflows/deploy-private-hud-cloudflare.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/hud-cloud/**'
      - 'dashboard/command-center/native-v8-9/**'
      - 'tests/test_hud_cloud.mjs'
      - 'tests/test_hud_github_deployment.mjs'
      - 'tests/test_hud_cloud_chat.mjs'
      - 'tests/test_hud_cloud_workforce.mjs'
      - 'tests/test_hud_mobile_drawer_stability.mjs'
      - 'tests/test_hud_private_review_page.mjs'
      - 'tests/test_hud_omniroute_relay.mjs'
      - 'tests/test_hud_chat_mobile.mjs'
      - 'tests/test_hud_repo_context.mjs'
      - 'tools/hud_repo_context.mjs'
      - 'tests/test_hud_chat_browser.cjs'
      - 'tests/test_hud_review_browser.cjs'
      - 'tools/hud_chat_relay_client.mjs'
      - 'tests/test_hud_ios_quota_rings.mjs'
      - 'tests/test_hud_provider_overview_layout.cjs'
      - 'tests/test_hud_gemini_project_quota.mjs'
      - 'integrations/hud-cloud/cloud-gemini-chat.mjs'
      - 'integrations/hud-cloud/verify-cloud-gemini.mjs'
      - 'integrations/hud-cloud/verify-live-gemini-catalog.mjs'
      - 'integrations/hud-cloud/private-worker-secret-payload.mjs'
      - 'tests/test_hud_gemini_key_activation.mjs'
      - 'tests/test_hud_live_gemini_catalog.mjs'
      - 'tests/test_hud_cloud_gemini.mjs'
      - 'tests/test_hud_gemini_coverage_workflow.mjs'
      - '.github/workflows/verify-gemini-model-coverage.yml'
      - 'tests/test_hud_omniroute_chat_relay.mjs'
      - 'tools/activate_hud_gemini_route.mjs'
      - 'tools/verify_hud_gemini_activation.mjs'
      - 'tests/test_hud_gemini_activation_workflow.mjs'
      - '.github/workflows/connect-google-gemini-hud.yml'
      - 'tools/hud_chat.mjs'
      - 'tools/manage_hud_telemetry_agent.sh'
      - '.github/workflows/deploy-private-hud-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build reviewed read-only GitHub source for tests
        run: node integrations/hud-cloud/build-repo-snapshot.mjs
      - name: Test private auth, nine-provider meters and GitHub release preflight
        run: |
          node --check integrations/hud-cloud/github-app.mjs
          node --check integrations/hud-cloud/review-evidence.mjs
          node --check integrations/hud-cloud/github-patch-gateway.mjs
          node --check integrations/hud-cloud/native-github-discovery.mjs
          node --check integrations/hud-cloud/repo-catchup.mjs
          node --check integrations/hud-cloud/repo-source.mjs
          node --check integrations/hud-cloud/build-repo-snapshot.mjs
          node --check integrations/hud-cloud/worker.mjs
          node --check integrations/hud-cloud/cloud-provider-catalog-bridge.mjs
          node --check integrations/hud-cloud/direct-provider-catalog.mjs
          node --check integrations/hud-cloud/verify-cloud-provider-catalog-bridge.mjs
          node --check integrations/hud-cloud/approved-workforce.mjs
          node --check integrations/hud-cloud/verify-cloud-workforce.mjs
          node --check integrations/hud-cloud/verify-mobile-hud.mjs
          node --check integrations/hud-cloud/verify-private-review-page.mjs
          node --check dashboard/command-center/native-v8-9/workforce-review.js
          node --check integrations/hud-cloud/groq-cloud-chat.mjs
          node --check integrations/hud-cloud/groq-quota-monitor.mjs
          node --check integrations/hud-cloud/idea-inbox.mjs
          node --check integrations/hud-cloud/discovery-inbox.mjs
          node --check integrations/hud-cloud/verify-groq-key.mjs
          node --check integrations/hud-cloud/omniroute-chat-relay.mjs
          node --check tools/hud_chat_relay_client.mjs
          node --check tools/activate_hud_gemini_route.mjs
          node --check tools/verify_hud_gemini_activation.mjs
          node --check tools/hud_repo_context.mjs
          node --check tools/hud_chat.mjs
          node --check dashboard/command-center/native-v8-9/hud-chat.js
          node --check integrations/hud-cloud/gemini-cloud-monitoring.mjs
          node --check integrations/hud-cloud/cloud-gemini-chat.mjs
          node --check integrations/hud-cloud/verify-cloud-gemini.mjs
          node --check integrations/hud-cloud/verify-live-gemini-catalog.mjs
          node --check integrations/hud-cloud/private-worker-secret-payload.mjs
          node --check integrations/hud-cloud/prepare-github-deploy.mjs
          node --check integrations/hud-cloud/verify-github-deploy.mjs
          bash -n tools/manage_hud_telemetry_agent.sh
          bash -n tools/install_hud_chat_relay.sh
          node --test tests/test_hud_cloud.mjs tests/test_hud_cloud_gemini.mjs tests/test_hud_gemini_coverage_workflow.mjs tests/test_hud_gemini_key_activation.mjs tests/test_hud_live_gemini_catalog.mjs tests/test_hud_github_deployment.mjs tests/test_hud_ios_quota_rings.mjs tests/test_hud_provider_overview_layout.cjs tests/test_hud_gemini_project_quota.mjs tests/test_hud_cloud_chat.mjs tests/test_hud_cloud_workforce.mjs tests/test_hud_mobile_drawer_stability.mjs tests/test_hud_private_review_page.mjs tests/test_hud_omniroute_relay.mjs tests/test_hud_chat_mobile.mjs tests/test_hud_omniroute_chat_relay.mjs tests/test_hud_gemini_activation_workflow.mjs tests/test_hud_repo_context.mjs tests/test_hud_groq_cloud.mjs tests/test_hud_groq_quota.mjs tests/test_hud_groq_key_probe.mjs tests/test_hud_idea_inbox.mjs tests/test_hud_discovery_inbox.mjs tests/test_hud_repo_source_cloud.mjs tests/test_rovor_native_discovery.mjs tests/test_rovor_github_patch.mjs tests/test_hud_cloud_provider_catalog_bridge.mjs tests/test_rovor_owner_control.mjs tests/test_rovor_github_app_verification.mjs tests/test_rovor_review_evidence.mjs

      - name: Verify interactive Ask ROVOR on phone, tablet and desktop Chromium viewports
        run: node tests/test_hud_chat_browser.cjs
      - name: Verify decision-first owner review on phone, tablet and desktop Chromium
        run: node tests/test_hud_review_browser.cjs

      - name: Diagnose live unauthenticated response codes (no credentials)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -uo pipefail
          origin='https://rovor-hud-telemetry.rovordigital.workers.dev'
          for resource in '/api/hud/status' '/hud-quota.js' '/'; do
            code=$(curl -sS --max-time 12 --retry 0 --output /dev/null --write-out '%{http_code}' "${origin}${resource}") || code="transport_failure:${code}"
            echo "ROVOR private HUD anonymous GET ${resource}: ${code}"
          done

  deploy:
    needs: safety-tests
    # Never expose secrets to pull_request, untrusted branches, or AI PR code.
    # Approved HUD changes merged into main deploy automatically after the
    # safety-tests job; manual workflow_dispatch remains a recovery option.
    # The protected production environment, fail-closed preflight, D1 checks,
    # serialized deployments and live private readback stay mandatory.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: rovor-hud-production
    concurrency:
      group: rovor-hud-private-deployment
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROVOR_HUD_D1_ID: ${{ secrets.ROVOR_HUD_D1_ID }}
      ROVOR_HUD_WRITER_TOKEN: ${{ secrets.ROVOR_HUD_WRITER_TOKEN }}
      ROVOR_HUD_READER_TOKEN: ${{ secrets.ROVOR_HUD_READER_TOKEN }}
      ROVOR_HUD_OWNER_TOKEN: ${{ secrets.ROVOR_HUD_OWNER_TOKEN }}
      # Existing Site service key, optionally bridged to Worker; never echoed.
      ROVOR_GHOST_SERVICE_TOKEN: ${{ secrets.ROVOR_GHOST_SERVICE_TOKEN }}
      # Optional direct GET-only model catalogs. Never treat keys as free inference approval.
      ROVOR_CLOUD_MISTRAL_API_KEY: ${{ secrets.ROVOR_MISTRAL_API_KEY || secrets.MISTRAL_API_KEY }}
      ROVOR_CLOUD_NVIDIA_API_KEY: ${{ secrets.ROVOR_NVIDIA_API_KEY || secrets.NVIDIA_API_KEY }}
      ROVOR_CLOUD_COHERE_API_KEY: ${{ secrets.ROVOR_COHERE_API_KEY || secrets.COHERE_API_KEY }}
      ROVOR_CLOUD_SAMBANOVA_API_KEY: ${{ secrets.ROVOR_SAMBANOVA_API_KEY || secrets.SAMBANOVA_API_KEY }}
      ROVOR_CLOUD_OPENROUTER_API_KEY: ${{ secrets.ROVOR_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
      ROVOR_CLOUD_HUGGINGFACE_API_KEY: ${{ secrets.ROVOR_HUGGINGFACE_API_KEY || secrets.HUGGINGFACE_API_KEY }}
      ROVOR_CLOUD_CLOUDFLARE_AI_API_KEY: ${{ secrets.ROVOR_CLOUDFLARE_AI_API_KEY }}
      ROVOR_HUD_DEPLOY_ORIGIN: ${{ vars.ROVOR_HUD_DEPLOY_ORIGIN }}
      ROVOR_GEMINI_CLOUD_API_KEY: ${{ secrets.ROVOR_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
      GEMINI_ACTIVATE_ONCE: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[gemini-activate-once]') || contains(github.event.head_commit.message, '[gemini-verify-3.8-flash]')) }}
      ROVOR_GEMINI_TEST_MODEL: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[gemini-verify-3.8-flash]') && 'gemini-3.8-flash' || '' }}
      ROVOR_GITHUB_APP_ID: ${{ secrets.ROVOR_GITHUB_APP_ID }}
      ROVOR_GITHUB_INSTALLATION_ID: ${{ secrets.ROVOR_GITHUB_INSTALLATION_ID }}
      ROVOR_GITHUB_APP_PRIVATE_KEY: ${{ secrets.ROVOR_GITHUB_APP_PRIVATE_KEY }}
      # A one-time owner-requested activation may supply the default if the
      # repository variable is unset. Explicit false always takes precedence.
      ROVOR_NATIVE_DISCOVERY_ENABLED: ${{ vars.ROVOR_NATIVE_DISCOVERY_ENABLED || (github.event_name == 'push' && contains(github.event.head_commit.message, '[rovor-native-discovery-activate]') && 'true' || '') }}
      ROVOR_GITHUB_PATCH_ENABLED: ${{ vars.ROVOR_GITHUB_PATCH_ENABLED }}
      ROVOR_GITHUB_PATCH_PATHS: ${{ vars.ROVOR_GITHUB_PATCH_PATHS }}
      GROQ_HUD_API_KEY: ${{ secrets.ROVOR_HUD_GROQ_API_KEY }}
      GROQ_HUD_CHAT_ENABLED: ${{ vars.ROVOR_HUD_GROQ_CHAT_ENABLED }}
      GROQ_HUD_FREE_TIER_VERIFIED: ${{ vars.ROVOR_HUD_GROQ_FREE_TIER_VERIFIED }}
      GROQ_HUD_EVIDENCE_SHA256: ${{ vars.ROVOR_HUD_GROQ_EVIDENCE_SHA256 }}
      GROQ_HUD_VERIFIED_AT: ${{ vars.ROVOR_HUD_GROQ_VERIFIED_AT }}
      GROQ_HUD_VALID_UNTIL: ${{ vars.ROVOR_HUD_GROQ_VALID_UNTIL }}
      GROQ_HUD_DAILY_BUDGET: ${{ vars.ROVOR_HUD_GROQ_DAILY_BUDGET }}
    defaults:
      run:
        working-directory: integrations/hud-cloud
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify trusted main, independently held credentials, and private Worker-first config
        run: node prepare-github-deploy.mjs
      - name: Refuse incomplete owner-authorized Gemini activation before any cloud write
        if: env.GEMINI_ACTIVATE_ONCE == 'true'
        run: node private-worker-secret-payload.mjs --preflight
      - name: Verify independent GitHub App installation and read-only repository access
        run: node verify-github-app.mjs --credentials
      - name: Inspect GitHub draft-PR capability without enabling writes (informational)
        run: node verify-github-app.mjs --patch-capability
      - name: Resolve optional draft-PR scope; keep read-only HUD deployable and writes fail-closed
        run: node verify-github-app.mjs --patch-effective
      - name: Freeze curated GitHub sources at the reviewed main SHA
        run: node build-repo-snapshot.mjs
      - name: Install Wrangler (Cloudflare-owned hosting, no ChatGPT Site publisher)
        run: npm install --global wrangler@4
      - name: Ensure only the existing private telemetry tables exist in the assigned D1
        run: |
          wrangler d1 execute DB --remote --file=schema.sql --config wrangler.github.jsonc
      - name: Publish original HUD and private telemetry Worker from GitHub
        run: wrangler deploy --config wrangler.github.jsonc
      - name: Restore existing HUD tokens, Groq settings, and one-time Gemini activation secrets
        shell: bash
        run: |
          set -euo pipefail
          node private-worker-secret-payload.mjs |
            wrangler secret bulk --config wrangler.github.jsonc
      - name: Verify independent GitHub discovery configuration and native D1 readback
        run: node verify-github-app.mjs --worker
      - name: Refresh bounded private GitHub catch-up metadata with writer authentication (no inference)
        run: node verify-github-app.mjs --repo-catchup-refresh
      - name: Verify private GitHub catch-up route and distinguish installed from completed checkpoint
        run: node verify-github-app.mjs --repo-catchup
      - name: Verify deployed GitHub draft-PR executor and exact private path allowlist
        run: node verify-github-app.mjs --patch-worker
      - name: Verify the nine provider catalog slots through authenticated Cloudflare D1 readback (never inference)
        run: node verify-cloud-provider-catalog-bridge.mjs
      - name: Check deployed private owner review gate without owner login or changes
        run: node verify-github-app.mjs --owner-session
      - name: Verify anonymous denial, authenticated original HUD, quota script, and D1 status
        run: node verify-github-deploy.mjs
      - name: Report authenticated Google Gemini key-listed models from deployed Cloudflare HUD (no inference)
        run: node verify-live-gemini-catalog.mjs
      - name: Prove private Cloudflare workforce STOP, writer-only tick and durable D1 status (no inference)
        run: node verify-cloud-workforce.mjs
      - name: Confirm private review desk is deployed, authenticated and byte-for-byte current
        run: node verify-private-review-page.mjs
      - name: Confirm real mobile scroll fixes and CSS are deployed on private HUD
        run: node verify-mobile-hud.mjs
      - name: Prove one real Gemini answer and an advancing private D1 receipt (owner-approved, no replay)
        if: env.GEMINI_ACTIVATE_ONCE == 'true'
        run: node verify-cloud-gemini.mjs
      - name: Independently inspect Groq catalogue from trusted GitHub runner (no inference)
        run: node verify-groq-key.mjs
