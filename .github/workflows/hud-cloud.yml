name: HUD persistent telemetry
on:
  pull_request:
    paths: ['integrations/hud-cloud/**', 'tools/hud_telemetry_publisher.mjs', 'tests/test_hud_cloud.mjs', '.github/workflows/hud-cloud.yml']
  push:
    branches: [main, feature/hud-persistent-telemetry-20261024]
    paths: ['integrations/hud-cloud/**', 'tools/hud_telemetry_publisher.mjs', 'tests/test_hud_cloud.mjs', '.github/workflows/hud-cloud.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_hud_cloud.mjs
