name: HUD persistent telemetry
on:
  pull_request:
    paths: ['integrations/hud-cloud/**', 'coordination/cloud-shifts/**', 'tools/hud_telemetry_publisher.mjs', 'tests/test_hud_cloud.mjs', 'tests/test_hud_sites.mjs', 'tests/test_hud_cloud_activity.mjs', 'tests/test_hud_cloud_reviews.mjs', 'coordination/cloud-reviews/**', '.github/workflows/hud-cloud-reviews.yml', '.github/workflows/hud-cloud.yml']
  push:
    branches: [main, feature/hud-persistent-telemetry-20261024, feature/hud-sites-adapter-20261024, feature/hud-cloud-activity-20261024, feature/hud-owner-reviews-20261024]
    paths: ['integrations/hud-cloud/**', 'coordination/cloud-shifts/**', 'tools/hud_telemetry_publisher.mjs', 'tests/test_hud_cloud.mjs', 'tests/test_hud_sites.mjs', 'tests/test_hud_cloud_activity.mjs', 'tests/test_hud_cloud_reviews.mjs', 'coordination/cloud-reviews/**', '.github/workflows/hud-cloud-reviews.yml', '.github/workflows/hud-cloud.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_hud_cloud.mjs tests/test_hud_sites.mjs tests/test_hud_cloud_activity.mjs tests/test_hud_cloud_reviews.mjs
      - name: Verify recorded cloud result against GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node integrations/hud-cloud/verify-cloud-activity.mjs
