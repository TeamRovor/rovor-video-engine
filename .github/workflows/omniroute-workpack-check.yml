name: OmniRoute draft-workpack offline checks
on:
  pull_request:
    paths:
      - 'tools/omniroute_workpack_runner.py'
      - 'tests/test_omniroute_workpack_runner.py'
      - 'coordination/omniroute-workpacks/**'
      - '.github/workflows/omniroute-workpack-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run fake OmniRoute model and no-side-effect tests
        run: python -m unittest discover -s tests -p test_omniroute_workpack_runner.py -v
      - name: Prove valid public workpack dry-runs without model calls
        run: |
          python tools/omniroute_workpack_runner.py --packet provider-efficiency
          python tools/omniroute_workpack_runner.py --packet supervisor-resilience
      - name: Removed public runner workflow must fail closed
        run: |
          if [ -f .github/workflows/rovor-mac-exec-proof.yml ]; then
            python tools/omniroute_workpack_runner.py --packet runner-blocker
          elif python tools/omniroute_workpack_runner.py --packet runner-blocker; then
            echo "SECURITY FAILURE: missing runner source incorrectly accepted"
            exit 1
          else
            echo "Expected: runner-blocker denied because its source workflow is absent"
          fi
