name: HUD provider job receipts (offline)

on:
  pull_request:
    paths:
      - 'dashboard/command-center/native-v8-9/live-quota-board.js'
      - 'tests/test_hud_live_quota_jobs.cjs'
      - '.github/workflows/hud-provider-job-receipts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify provider-attributed jobs and escaping
        run: node tests/test_hud_live_quota_jobs.cjs
