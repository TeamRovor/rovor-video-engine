name: Nine-provider cloud runtime checks
on:
  push:
    paths: ['integrations/ghost-cloud/**', 'tests/test_ghost_cloud.mjs', '.github/workflows/ghost-cloud.yml']
  pull_request:
    paths: ['integrations/ghost-cloud/**', 'tests/test_ghost_cloud.mjs', '.github/workflows/ghost-cloud.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_ghost_cloud.mjs
      - run: python3 tools/project_loop.py check
      - run: python3 tools/task_routing_pair.py --check
