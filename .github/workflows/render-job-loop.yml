name: Render job transport checks
on:
  pull_request:
    paths: ['tools/render_jobs.py', 'tests/test_render_jobs.py', 'tools/speech_plan_gate.py', 'tests/test_speech_plan_gate.py', 'tests/test_silence_backed_gaps.py', '.github/workflows/render-job-loop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_render_jobs.py -v
      - run: python -m unittest discover -s tests -p test_speech_plan_gate.py -v
      - run: python -m unittest discover -s tests -p test_silence_backed_gaps.py -v
