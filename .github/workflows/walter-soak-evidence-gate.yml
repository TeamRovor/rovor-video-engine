name: Walter independent 24h OmniRoute evidence regression
on:
  pull_request:
    paths:
      - tools/walter_soak_evidence_gate.py
      - tests/test_walter_soak_evidence_gate.py
      - .github/workflows/walter-soak-evidence-gate.yml
      - coordination/tasks.json
      - coordination/work-routing.json
  push:
    branches: [main]
    paths:
      - tools/walter_soak_evidence_gate.py
      - tests/test_walter_soak_evidence_gate.py
      - .github/workflows/walter-soak-evidence-gate.yml
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline 24h heartbeat and claim safety evidence
        run: python -m unittest discover -s tests -p 'test_walter_soak_evidence_gate.py' -v
      - name: Canonical ownership and routing
        run: |
          python tools/project_loop.py check
          python tools/task_routing_pair.py --check
