name: Source Evan hand front of held prop, real pixel test

on:
  push:
    branches: [feature/nonmoho-hand-over-prop-occlusion-v1]
    paths:
      - 'evan-engine/directed_grip_occlusion.py'
      - 'evan-engine/directed_scene.py'
      - 'evan-engine/test_directed_grip_occlusion.py'
      - '.github/workflows/grip-occlusion.yml'
  pull_request:
    paths:
      - 'evan-engine/directed_grip_occlusion.py'
      - 'evan-engine/directed_scene.py'
      - 'evan-engine/test_directed_grip_occlusion.py'
      - '.github/workflows/grip-occlusion.yml'

permissions:
  contents: read

jobs:
  source-original-grip:
    name: Actual source hand over source tool ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original raster rig dependencies
        run: python -m pip install pillow==10.4.0 numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Test actual hand-over-tool pixels and previous physical animation
        working-directory: evan-engine
        run: |
          python -m py_compile directed_scene.py directed_grip_occlusion.py test_directed_grip_occlusion.py
          python -m unittest -v test_directed_grip_occlusion test_grip_raster_qa test_right_hand_grip test_directed_paint test_directed_contact_lock test_directed_contact test_directed_scene

