name: Continuous OmniRoute research runtime
on:
  push:
    branches: [fix/omniroute-continuous-runtime]
  pull_request:
    paths:
      - tools/ghost_worker.py
      - tools/omniroute_continuous.py
      - tools/omniroute_dispatch_pacing.py
      - tools/install_continuous_worker.py
      - tests/test_omniroute_continuous.py
      - tests/test_omniroute_dispatch_pacing.py
      - tests/test_install_continuous_worker.py
      - .github/workflows/omniroute-continuous.yml
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.9'}
          - {os: ubuntu-latest, python: '3.11'}
          - {os: macos-latest, python: '3.11'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.python == '3.9'
        run: python -m pip install tomli==2.2.1
      - run: python -m unittest discover -s tests -p test_omniroute_continuous.py -v
      - run: python -m unittest discover -s tests -p test_install_continuous_worker.py -v
      - run: python -m unittest discover -s tests -p test_omniroute_dispatch_pacing.py -v
      - run: python tools/check_workforce.py
