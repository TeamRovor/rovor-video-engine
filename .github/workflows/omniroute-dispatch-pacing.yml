name: OmniRoute dispatch pacing
on:
  push:
    paths:
      - tools/omniroute_dispatch_pacing.py
      - tests/test_omniroute_dispatch_pacing.py
      - .github/workflows/omniroute-dispatch-pacing.yml
  pull_request:
    paths:
      - tools/omniroute_dispatch_pacing.py
      - tests/test_omniroute_dispatch_pacing.py
      - .github/workflows/omniroute-dispatch-pacing.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p test_omniroute_dispatch_pacing.py -v
