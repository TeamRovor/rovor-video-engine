name: Groq authenticated quota evidence
on:
  pull_request:
    paths:
      - 'integrations/ghost-cloud/site-operations.mjs'
      - 'tests/test_ghost_cloud_groq_quota.mjs'
      - '.github/workflows/ghost-cloud-groq-quota-tests.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/ghost-cloud/site-operations.mjs'
      - 'tests/test_ghost_cloud_groq_quota.mjs'
      - '.github/workflows/ghost-cloud-groq-quota-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_ghost_cloud_groq_quota.mjs
