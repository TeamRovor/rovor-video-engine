name: Moho Bridge Forensics Auto Report

# Restricted diagnostic, runs once when introduced and can be re-run manually.
# Only reads scripts and IPC metadata; never calls mutation tools or changes Moho.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/moho-bridge-forensics-auto.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: moho-bridge-forensics
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 4
    steps:
      - name: Compare live IPC and installed Lua source, report to issue 6
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, subprocess, pathlib, tempfile, time, json, re, hashlib, urllib.request
          home=pathlib.Path.home()
          lines=["### Automatic Moho bridge forensic report", "Read-only run; no Moho commands or project changes."]
          def add(s):
              lines.append(str(s))
              print(s, flush=True)
          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()[:12] if p.is_file() else "MISSING"
          node="/usr/local/bin/node"
          node_tmp=None
          try:
              out=subprocess.run([node,"-p","require('os').tmpdir()"],capture_output=True,text=True,timeout=8)
              if out.returncode==0:
                  node_tmp=out.stdout.strip()
          except Exception as exc:
              add("Node temp path probe: "+type(exc).__name__)
          add("Node os.tmpdir() = "+repr(node_tmp))
          add("Python tempfile.gettempdir() = "+repr(tempfile.gettempdir()))
          add("MOHO_MCP_IPC_DIR override present = "+str(bool(os.getenv("MOHO_MCP_IPC_DIR"))))
          candidates=[pathlib.Path(node_tmp)/"moho-mcp"] if node_tmp else []
          candidates.extend([pathlib.Path(tempfile.gettempdir())/"moho-mcp",pathlib.Path("/tmp/moho-mcp")])
          if os.getenv("MOHO_MCP_IPC_DIR"):
              candidates.insert(0,pathlib.Path(os.getenv("MOHO_MCP_IPC_DIR")))
          add("#### IPC queue states")
          seen=set()
          for d in candidates:
              resolved=str(d.resolve())
              if resolved in seen: continue
              seen.add(resolved)
              add("* Queue: "+str(d)+" ; exists = "+str(d.is_dir()))
              if not d.is_dir(): continue
              status=d/"status.json"
              if status.is_file():
                  try:
                      data=json.loads(status.read_text())
                      add("  - status.running = "+repr(data.get("running")))
                      add("  - status keys = "+repr(sorted(data.keys())))
                  except (OSError,ValueError) as exc:
                      add("  - status parse error = "+str(type(exc).__name__))
                  add("  - status file age (seconds) = "+str(round(time.time()-status.stat().st_mtime,1)))
              else:
                  add("  - status.json MISSING")
              for pat in ["req_*.json","resp_*.json"]:
                  files=list(d.glob(pat))
                  add("  - "+pat+" count = "+str(len(files)))
                  if files:
                      add("  - oldest age = "+str(round(time.time()-min(f.stat().st_mtime for f in files),1)))
          add("#### Lua source installation comparison")
          actual=pathlib.Path("/Applications/Moho.app/Contents/Resources/Support/Scripts")
          dev=home/"Documents/Moho-Astra/Evan/Projects/MohoMCP-Connection-Dev/moho-plugin"
          old=home/"Documents/Moho-Astra/MohoMCP-master/moho-plugin"
          for name in ["MohoMCP_Server.lua","MohoMCP_Poller.lua","MohoMCP_ProcessPending.lua"]:
              for label,base in [("installed-menu", actual/"Menu/MohoMCP"),("installed-tool",actual/"Tool"),("dev",dev),("legacy",old)]:
                  f=base/name
                  if f.is_file():
                      add("* "+name+" "+label+" hash="+sha(f)+" age_days="+str(round((time.time()-f.stat().st_mtime)/86400,2)))
          add("#### Actual installed server & poller IPC/polling references")
          sources=[actual/"Menu/MohoMCP/MohoMCP_Server.lua",actual/"Tool/MohoMCP_Poller.lua",dev/"MohoMCP_Server.lua",dev/"MohoMCP_Poller.lua"]
          regex=re.compile(r'IPC|tmp|temp|req_|resp_|pollActive|DrawMe|processPending|server.poll|GetTemp|status.json|startServer',re.I)
          unsafe=re.compile(r'token|secret|password|private.key|credential',re.I)
          for f in sources:
              if not f.is_file(): continue
              label=("installed: " if str(f).startswith("/Applications/") else "dev: ")+f.name
              add("* "+label)
              matching=[]
              for n,line in enumerate(f.read_text(errors="replace").splitlines(),1):
                  if regex.search(line) and not unsafe.search(line):
                      matching.append("  - L"+str(n)+": "+line.strip()[:160])
              lines.extend(matching[:27])
              print("\n".join(matching[:27]),flush=True)
          add("#### Installed versus development server diff (first 100 changed lines)")
          installed=actual/"Menu/MohoMCP/MohoMCP_Server.lua"
          development=dev/"MohoMCP_Server.lua"
          if installed.is_file() and development.is_file():
              import difflib
              differences=list(difflib.unified_diff(
                  installed.read_text(errors="replace").splitlines(),
                  development.read_text(errors="replace").splitlines(),
                  fromfile="installed server",tofile="development server",lineterm=""))
              add("Changed diff lines total = "+str(len(differences)))
              lines.append("~~~diff")
              for line in differences[:100]:
                  if not unsafe.search(line): lines.append(line[:185])
              lines.append("~~~")
              print("\n".join(differences[:100]),flush=True)
          add("#### Runtime status PID check")
          if node_tmp:
              sf=pathlib.Path(node_tmp)/"moho-mcp/status.json"
              if sf.is_file():
                  try:
                      sd=json.loads(sf.read_text())
                      pid=sd.get("pid")
                      if type(pid) is int and pid>0:
                          try:
                              os.kill(pid,0)
                              add("Status-file PID is alive = True")
                          except ProcessLookupError:
                              add("Status-file PID is alive = False")
                          except PermissionError:
                              add("Status-file PID exists but permission denied")
                      else: add("No numeric pid in status.json")
                  except Exception as exc:
                      add("Status PID check failed: "+type(exc).__name__)
          add("#### Live document_getInfo request consumption test (read-only)")
          import select
          bridge=home/"Documents/Moho-Astra/MohoMCP-Enhanced/bridge/dist/index.js"
          if not bridge.is_file() or not node_tmp:
              add("Bridge file or temp path missing, live test skipped")
          else:
              process=None
              pending_seen=0
              cleared_seen=0
              response_seen=0
              rpc_response=None
              focus_attempted=False
              try:
                  process=subprocess.Popen([node,str(bridge)],
                      stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,bufsize=0)
                  def req(i,method,params=None):
                      q={"jsonrpc":"2.0","id":i,"method":method}
                      if params is not None:q["params"]=params
                      process.stdin.write((json.dumps(q)+"\n").encode())
                      process.stdin.flush()
                  def wait(i,timeout):
                      deadline=time.monotonic()+timeout
                      while time.monotonic()<deadline:
                          ready,_,_=select.select([process.stdout],[],[],max(0,deadline-time.monotonic()))
                          if not ready:break
                          raw=process.stdout.readline()
                          if not raw: break
                          try: data=json.loads(raw)
                          except Exception:continue
                          if data.get("id")==i:return data
                      return None
                  req(101,"initialize",{"protocolVersion":"2025-03-26",
                      "capabilities":{},"clientInfo":{"name":"rovor-safe-ipc-consumption-check","version":"1"}})
                  a=wait(101,8)
                  if not a or a.get("error"):raise RuntimeError("MCP initialization failed: "+repr(a)[:180]+", process_status="+repr(process.poll()))
                  process.stdin.write(b'{"jsonrpc":"2.0","method":"notifications/initialized"}\n')
                  process.stdin.flush()
                  req(103,"tools/call",{"name":"document_getInfo","arguments":{}})
                  queue=pathlib.Path(node_tmp)/"moho-mcp"
                  deadline=time.monotonic()+13
                  while time.monotonic()<deadline:
                      ps=list(queue.glob("req_*.json"))
                      rs=list(queue.glob("resp_*.json"))
                      if ps:pending_seen+=1
                      elif pending_seen:cleared_seen+=1
                      if pending_seen==6 and not focus_attempted:
                          focus_attempted=True
                          try:
                              active=subprocess.run(["/usr/bin/osascript","-e",
                                  'tell application "Moho" to activate'],
                                  capture_output=True,text=True,timeout=5)
                              add("Moho foreground-only activation exit code = "+str(active.returncode))
                          except Exception as focuserr:
                              add("Moho activation failed: "+type(focuserr).__name__)
                      if rs:response_seen+=1
                      ready,_,_=select.select([process.stdout],[],[],0.15)
                      if ready:
                          raw=process.stdout.readline()
                          try:data=json.loads(raw)
                          except Exception:data={}
                          if data.get("id")==103:
                              rpc_response=data
                              break
                  add("Observed pending request snapshots = "+str(pending_seen))
                  add("Snapshots without pending request after first seen = "+str(cleared_seen))
                  add("Observed response-file snapshots = "+str(response_seen))
                  if rpc_response:
                      if rpc_response.get("error"):
                          add("MCP transport error = "+str(rpc_response["error"].get("message",""))[:300])
                      else:
                          value=rpc_response.get("result") or {}
                          content=" | ".join(str(t.get("text","")) for t in value.get("content",[]) if isinstance(t,dict))
                          if value.get("isError"):
                              add("Moho read failed = "+content[:360])
                          else:
                              add("Live Moho read SUCCESS = "+content[:600])
                  else:
                      add("No MCP tool response within 13 seconds")
              except Exception as exc:
                  add("Live test setup error = "+type(exc).__name__+": "+str(exc)[:260])
              finally:
                  if process:
                      try:
                          process.terminate()
                          process.wait(timeout=2)
                      except Exception:process.kill()
          add("#### Assessment gate")
          add("Live read: NOT verified by this diagnostic. Next step only after IPC path and Lua polling agree.")
          body="\n".join(lines)[:12500]
          # GitHub issue is private, but avoid including secrets, request data or absolute user files.
          request=urllib.request.Request(
              "https://api.github.com/repos/TeamRovor/rovor-video-engine/issues/6/comments",
              data=json.dumps({"body":body}).encode("utf-8"),
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Accept":"application/vnd.github+json",
                       "Content-Type":"application/json",
                       "X-GitHub-Api-Version":"2022-11-28"},
              method="POST")
          with urllib.request.urlopen(request,timeout=20) as response:
              add("Posted sanitized diagnostics to issue #6 (HTTP "+str(response.status)+")")
          PY
