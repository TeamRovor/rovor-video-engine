name: Integrated workforce offline checks

on:
  pull_request:
    paths:
      - 'tools/ghost*.py'
      - 'tools/interpreter*.py'
      - 'tools/fcp*.py'
      - 'tools/jane_native_worker.py'
      - 'tools/check_workforce.py'
      - '.openinterpreter/config.toml'
      - '.codex/config.toml'
      - 'tests/test_ghost*.py'
      - 'tests/test_interpreter*.py'
      - 'tests/test_fcp*.py'
      - '.github/workflows/workforce-check.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ghost*.py'
      - 'tools/interpreter*.py'
      - 'tools/fcp*.py'
      - 'tools/jane_native_worker.py'
      - 'tools/check_workforce.py'
      - '.openinterpreter/config.toml'
      - '.codex/config.toml'
      - 'tests/test_ghost*.py'
      - 'tests/test_interpreter*.py'
      - 'tests/test_fcp*.py'
      - '.github/workflows/workforce-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: TOML parser backport for Python 3.9 tests only
        if: matrix.python == '3.9'
        run: python -m pip install tomli==2.2.1
      - run: python tools/check_workforce.py
