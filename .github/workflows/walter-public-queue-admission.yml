name: Walter public OmniRoute seed admission offline regression
on:
  pull_request:
    paths:
      - tools/walter_public_queue_admission.py
      - tests/test_walter_public_queue_admission.py
      - tools/walter_public_task_grounding.py
      - .github/workflows/walter-public-queue-admission.yml
      - coordination/tasks.json
      - coordination/work-routing.json
  push:
    branches: [main]
    paths:
      - tools/walter_public_queue_admission.py
      - tests/test_walter_public_queue_admission.py
      - .github/workflows/walter-public-queue-admission.yml
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Public task admission and no-replay safety
        run: python -m unittest discover -s tests -p 'test_walter_public_queue_admission.py' -v
      - name: Canonical task ownership and paired routing
        run: |
          python tools/project_loop.py check
          python tools/task_routing_pair.py --check
