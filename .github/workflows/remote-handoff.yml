name: GitHub-only remote handoff

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'WORK.md'
      - 'tools/work_brief.py'
      - 'tests/test_work_brief.py'
      - 'coordination/work-routing.json'
      - 'REMOTE-EVAN-GITHUB.md'
      - 'tools/remote_handoff.py'
      - 'tests/test_remote_handoff.py'
      - '.github/workflows/remote-handoff.yml'
      - 'coordination/tasks.json'
  push:
    branches: [main]
    paths:
      - 'WORK.md'
      - 'tools/work_brief.py'
      - 'tests/test_work_brief.py'
      - 'coordination/work-routing.json'
      - 'REMOTE-EVAN-GITHUB.md'
      - 'tools/remote_handoff.py'
      - 'tests/test_remote_handoff.py'
      - '.github/workflows/remote-handoff.yml'
      - 'coordination/tasks.json'

permissions:
  contents: read

concurrency:
  group: remote-handoff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  summarize:
    name: Remote work snapshot (hosted, not a laptop check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the shared queue
        run: python tools/project_loop.py check
      - name: Test remote report behavior
        run: python -m unittest discover -s tests -p test_remote_handoff.py -v
      - name: Test capability-aware work routing
        run: python -m unittest discover -s tests -p test_work_brief.py -v
      - name: Publish GitHub-hosted handoff summary
        shell: bash
        run: |
          python tools/remote_handoff.py --revision "$GITHUB_SHA" --output handoff-brief.md > /dev/null
          cat handoff-brief.md >> "$GITHUB_STEP_SUMMARY"
          python tools/work_brief.py --participant "unclaimed-preview" --lane efficiency --capability github-read --capability github-write >> "$GITHUB_STEP_SUMMARY"
      - name: Attach report for review
        uses: actions/upload-artifact@v4
        with:
          name: remote-handoff-brief
          path: handoff-brief.md
          retention-days: 14
