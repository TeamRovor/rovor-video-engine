name: Original Evan raster wrist silhouette QA

on:
  push:
    branches: [feature/nonmoho-grip-raster-qa-v1]
    paths:
      - 'evan-engine/grip_raster_qa.py'
      - 'evan-engine/test_grip_raster_qa.py'
      - 'evan-engine/render_acting_video.py'
      - '.github/workflows/grip-raster-qa.yml'
  pull_request:
    paths:
      - 'evan-engine/grip_raster_qa.py'
      - 'evan-engine/test_grip_raster_qa.py'
      - 'evan-engine/render_acting_video.py'
      - '.github/workflows/grip-raster-qa.yml'

permissions:
  contents: read

jobs:
  original-source-raster:
    name: Actual 60fps Evan hand alpha in ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-rig renderer test dependencies
        run: python -m pip install pillow==10.4.0 numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Rasterize authentic Evan and test erased wrist refusal and previous geometry
        working-directory: evan-engine
        run: |
          python -m py_compile grip_raster_qa.py render_acting_video.py test_grip_raster_qa.py
          python -m unittest -v test_grip_raster_qa test_right_hand_grip test_directed_paint test_directed_contact_lock test_directed_contact test_directed_scene
