name: Ghost cloud Site composition (source-only)
on:
  push:
    paths:
      - 'integrations/ghost-cloud/site-composition.mjs'
      - 'tests/test_ghost_cloud_site_composition.mjs'
      - '.github/workflows/ghost-cloud-site-composition.yml'
  pull_request:
    paths:
      - 'integrations/ghost-cloud/site-composition.mjs'
      - 'tests/test_ghost_cloud_site_composition.mjs'
      - '.github/workflows/ghost-cloud-site-composition.yml'
permissions:
  contents: read
jobs:
  compose-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_ghost_cloud_site_composition.mjs
      - run: python3 tools/project_loop.py check
      - run: python3 tools/task_routing_pair.py --check
