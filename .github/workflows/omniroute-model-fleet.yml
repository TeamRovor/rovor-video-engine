name: OmniRoute model fleet inventory — offline tests
on:
  pull_request:
    paths:
      - tools/omniroute_model_fleet.py
      - tests/test_omniroute_model_fleet.py
      - .github/workflows/omniroute-model-fleet.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        py: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Test sanitized real OmniRoute CLI catalog parsing
        run: python -m unittest discover -s tests -p test_omniroute_model_fleet.py -v
