name: ROVOR legacy Site shift (owner diagnostic only)

# This obsolete GitHub-to-private-Site dispatcher returned 403 while the
# existing Cloudflare Worker already owns the live five-minute autonomous
# scheduler. Never keep a second unapproved cron making private HTTP calls.
on:
  workflow_dispatch:
    inputs:
      confirm_legacy_site_shift:
        description: "I explicitly authorize ONE old private-Site shift (not the Cloudflare workforce)"
        type: boolean
        required: true
        default: false
  pull_request:
    paths:
      - '.github/workflows/ghost-cloud-github-scheduler.yml'
      - 'tools/ghost_cloud_hosted_shift.py'
      - 'tests/test_ghost_cloud_hosted_shift.py'
  push:
    paths:
      - '.github/workflows/ghost-cloud-github-scheduler.yml'
      - 'tools/ghost_cloud_hosted_shift.py'
      - 'tests/test_ghost_cloud_hosted_shift.py'

permissions:
  contents: read

concurrency:
  # A scheduled invocation must not overlap another hosted invocation.
  # The private D1 runtime also owns durable job-claim and quota guards.
  group: rovor-cloud-hosted-shift
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline scheduler safety tests
        run: python3 -m unittest discover -s tests -p test_ghost_cloud_hosted_shift.py -v


  service-credential-preflight:
    # The old Site path is an opt-in, owner-protected diagnostic only.
    # No scheduled calls; never reveal secrets on PRs or on ordinary pushes.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_legacy_site_shift == true
    runs-on: ubuntu-latest
    environment: rovor-hud-production
    timeout-minutes: 1
    steps:
      - name: Verify hosted service secret shape without revealing value
        env:
          ROVOR_GHOST_SERVICE_TOKEN: ${{ secrets.ROVOR_GHOST_SERVICE_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          token = os.environ.get("ROVOR_GHOST_SERVICE_TOKEN", "")
          if not token:
              reason = "repository_service_secret_not_configured"
          elif len(token) < 32:
              reason = "repository_service_secret_too_short"
          elif any(not ("!" <= ch <= "~") for ch in token):
              reason = "repository_service_secret_invalid_bearer_format"
          else:
              reason = "repository_service_secret_shape_ok"
          print(json.dumps({"state": reason, "dispatched": 0}))
          if reason != "repository_service_secret_shape_ok":
              print("::error title=ROVOR hosted secret invalid::Configure a matching dedicated 32+ character service credential in Actions and the existing private Site.")
              sys.exit(1)
          print("Credential shape passes; matching Site configuration and live shift remain unverified.")
          PY

  shift:
    # One explicit owner opt-in, AFTER credential shape preflight. This cannot
    # be accidentally invoked by a pull request, push or automated schedule.
    needs: service-credential-preflight
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_legacy_site_shift == true
    runs-on: ubuntu-latest
    environment: rovor-hud-production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One bounded existing provider-cloud shift
        env:
          ROVOR_GHOST_SERVICE_TOKEN: ${{ secrets.ROVOR_GHOST_SERVICE_TOKEN }}
        run: python3 tools/ghost_cloud_hosted_shift.py
