name: ROVOR legacy Site shift (manual diagnostic only)

# The production cloud workforce runs on the existing Cloudflare Worker
# */5-minute native cron (wrangler.jsonc + worker.scheduled). The old Site
# service returned HTTP 403 and must not compete as another live scheduler.
# Retain a deliberately confirmed manual legacy diagnostic only.
on:
  workflow_dispatch:
    inputs:
      confirm_legacy_site_diagnostic:
        type: boolean
        required: true
        default: false
        description: 'Diagnostic ONLY: try the retired private Site endpoint; may return HTTP 403'
  pull_request:
    paths:
      - '.github/workflows/ghost-cloud-github-scheduler.yml'
      - 'tools/ghost_cloud_hosted_shift.py'
      - 'tests/test_ghost_cloud_hosted_shift.py'
  push:
    paths:
      - '.github/workflows/ghost-cloud-github-scheduler.yml'
      - 'tools/ghost_cloud_hosted_shift.py'
      - 'tests/test_ghost_cloud_hosted_shift.py'

permissions:
  contents: read

concurrency:
  # A scheduled invocation must not overlap another hosted invocation.
  # The private D1 runtime also owns durable job-claim and quota guards.
  group: rovor-cloud-hosted-shift
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline scheduler safety tests
        run: python3 -m unittest discover -s tests -p test_ghost_cloud_hosted_shift.py -v



  shift:
    # This cannot run on pull_request, push or timer; even a manual run
    # requires an explicit owner check and never affects the Cloudflare cron.
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_legacy_site_diagnostic == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One bounded existing provider-cloud shift
        env:
          ROVOR_GHOST_SERVICE_TOKEN: ${{ secrets.ROVOR_GHOST_SERVICE_TOKEN }}
        run: python3 tools/ghost_cloud_hosted_shift.py
