name: Walter snapshot continuity
on:
  pull_request:
    paths:
      - 'tools/walter_snapshot_continuity.py'
      - 'tests/test_walter_snapshot_continuity.py'
      - '.github/workflows/walter-snapshot-continuity.yml'
      - 'coordination/tasks.json'
      - 'coordination/work-routing.json'
  push:
    branches: [main]
    paths:
      - 'tools/walter_snapshot_continuity.py'
      - 'tests/test_walter_snapshot_continuity.py'
      - '.github/workflows/walter-snapshot-continuity.yml'
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cross-shift receipt and heartbeat continuity
        run: python -m unittest discover -s tests -p 'test_walter_snapshot_continuity.py' -v
      - name: Canonical coordination integrity
        run: |
          python tools/project_loop.py check
          python tools/task_routing_pair.py --check
