name: RUN WALTER ONCE - propose GitHub workflow

# Single explicit owner authorization. Not continuous inference.
# Walter's private Gemini output must be reviewed PASS before any GitHub PR.
on:
  workflow_dispatch:
    inputs:
      approve_walter_workflow_draft:
        description: "I authorize one new free-tier Gemini Walter workflow-proposal draft for my PASS/FAIL review"
        type: boolean
        required: true
        default: false
  pull_request:
    paths:
      - '.github/workflows/run-walter-workflow-once.yml'
      - 'tests/test_rovor_ai_workflow_factory.mjs'
      - 'tools/cloud_gemini_workforce_control.mjs'
      - 'coordination/tasks.json'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify reviewed workflow proposal cannot execute raw model output
        run: |
          node --check tools/cloud_workflow_proposal_bridge.mjs
          node --check tools/cloud_gemini_workforce_control.mjs
          node --test tests/test_rovor_ai_workflow_factory.mjs tests/test_hud_cloud_workforce.mjs

  owner-approved-walter:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: rovor-hud-production
    concurrency:
      group: rovor-gemini-workforce-owner-control
      cancel-in-progress: false
    env:
      ROVOR_HUD_READER_TOKEN: ${{ secrets.ROVOR_HUD_READER_TOKEN }}
      ROVOR_HUD_WRITER_TOKEN: ${{ secrets.ROVOR_HUD_WRITER_TOKEN }}
      ROVOR_WORKFORCE_ACTION: pilot_once
      ROVOR_WORKFORCE_TASK_ID: cloud-walter-workflow-factory-20261110
      ROVOR_WORKFORCE_REVISION: v2
      ROVOR_OWNER_CONFIRMS_NEW_TASK: ${{ inputs.approve_walter_workflow_draft }}
    steps:
      - name: Fail closed unless owner explicitly approves one new task
        run: |
          if [ "${ROVOR_OWNER_CONFIRMS_NEW_TASK}" != "true" ]; then
            echo "::error title=Owner approval required::Check the box for one Walter workflow proposal draft."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: One new owner-approved Gemini proposal, private D1 receipt and STOP restored
        run: node tools/cloud_gemini_workforce_control.mjs
