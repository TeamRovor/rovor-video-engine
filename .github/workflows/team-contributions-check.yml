name: ROVOR human team contribution attribution
on:
  pull_request:
    paths:
      - "dashboard/command-center/native-v8-9/team-contributions.js"
      - "dashboard/command-center/tools/inject-team-contributions.mjs"
      - "dashboard/command-center/tests/team-contributions.test.cjs"
      - ".github/workflows/team-contributions-check.yml"
      - ".github/workflows/deploy-command-center-pages.yml"
  push:
    branches:
      - main
    paths:
      - "dashboard/command-center/native-v8-9/team-contributions.js"
      - "dashboard/command-center/tools/inject-team-contributions.mjs"
      - "dashboard/command-center/tests/team-contributions.test.cjs"
      - ".github/workflows/team-contributions-check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify non-destructive HUD enhancement
        run: |
          node --check dashboard/command-center/native-v8-9/team-contributions.js
          node --check dashboard/command-center/tools/inject-team-contributions.mjs
          node --test dashboard/command-center/tests/team-contributions.test.cjs
