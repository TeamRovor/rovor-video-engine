name: Rovor Owned-Mac Restricted Execution Proof

# One harmless, main-branch, allowlisted Mac sandbox write/readback.
# No arbitrary shell from task input, GUI, model, user media or credentials.
on:
  push:
    branches: [main]
    paths:
      - 'rovor-production/mac-queue/exec-smoke-*.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: rovor-owned-mac-exec-proof
  cancel-in-progress: false

jobs:
  sandbox-proof:
    if: github.repository == 'TeamRovor/rovor-video-engine'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 4
    steps:
      - name: Write and read back a new private sandbox proof file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import re
          import urllib.parse
          import urllib.request

          repo = "TeamRovor/rovor-video-engine"
          write_request = "rovor-production/mac-queue/exec-smoke-20261022-01.json"
          read_request = "rovor-production/mac-queue/exec-smoke-20261022-02.json"
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]

          def github_get(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=18) as response:
                  return json.load(response)

          change = github_get("https://api.github.com/repos/" + repo + "/commits/" + sha)
          requests = [
              f["filename"] for f in change.get("files", [])
              if f.get("status") in ("added", "modified")
              and f.get("filename", "").startswith("rovor-production/mac-queue/exec-smoke-")
              and f.get("filename", "").endswith(".json")
          ]
          if len(requests) != 1 or requests[0] not in (write_request, read_request):
              raise SystemExit("REFUSED: commit does not contain exactly one supported request")
          expected_path = requests[0]
          url = ("https://api.github.com/repos/" + repo + "/contents/"
                 + urllib.parse.quote(expected_path, safe="/") + "?ref=" + sha)
          fetched = github_get(url)
          if fetched.get("encoding") != "base64":
              raise SystemExit("REFUSED: unexpected request encoding")
          task = json.loads(base64.b64decode(fetched["content"]))
          if expected_path == read_request:
              if task != {"version": 1, "action": "sandbox.verify_prior",
                          "id": "mac-link-20261022-01"}:
                  raise SystemExit("REFUSED: readback task outside allowlist")
              path = pathlib.Path.home() / "Documents" / "Rovor" / "ChatGPT-Link-Proof" / "mac-link-20261022-01.txt"
              expected = b"ROVOR Mac execution proof\nmac-link-20261022-01\n"
              found = path.is_file() and not path.is_symlink()
              observed = path.read_bytes() if found else None
              valid = observed == expected
              payload = {"status": "VERIFIED" if valid else "NOT_VERIFIED",
                         "execution_path": "github-self-hosted-runner",
                         "platform": platform.system(),
                         "file_observed": found,
                         "exact_content_match": valid,
                         "sha256": hashlib.sha256(observed).hexdigest() if valid else None,
                         "app_control_verified": False,
                         "open_interpreter_control_verified": False}
              body = ("**Mac execution readback (fixed sandbox only)**\n\n"
                      + "```json\n" + json.dumps(payload, indent=2, sort_keys=True)
                      + "\n```\n"
                      + "This demonstrates only the fixed owned-Mac sandbox round trip, "
                      + "not unlimited chat OS access.")
              endpoint = "https://api.github.com/repos/" + repo + "/issues/48/comments"
              request = urllib.request.Request(endpoint,
                  data=json.dumps({"body": body}).encode("utf-8"),
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2022-11-28"}, method="POST")
              with urllib.request.urlopen(request, timeout=18) as response:
                  if response.status != 201:
                      raise SystemExit("Could not post safe readback result")
              print("ROVOR_MAC_EXECUTION_READBACK " + json.dumps(payload, sort_keys=True))
              raise SystemExit(0 if valid else 2)

          if task != {
              "version": 1,
              "action": "sandbox.write_readback",
              "id": "mac-link-20261022-01",
          }:
              raise SystemExit("REFUSED: request outside fixed harmless operation")
          nonce = task["id"]
          if not re.fullmatch(r"[a-z0-9-]{6,60}", nonce):
              raise SystemExit("REFUSED: invalid proof identifier")
          if platform.system() != "Darwin":
              raise SystemExit("REFUSED: worker is not macOS")
          base = pathlib.Path.home() / "Documents" / "Rovor"
          if base.is_symlink() or not base.is_dir():
              raise SystemExit("REFUSED: expected Rovor workspace missing or redirected")
          sandbox = base / "ChatGPT-Link-Proof"
          if sandbox.is_symlink():
              raise SystemExit("REFUSED: sandbox is a symlink")
          sandbox.mkdir(mode=0o700, exist_ok=True)
          if sandbox.is_symlink() or not sandbox.is_dir():
              raise SystemExit("REFUSED: unsafe sandbox directory")
          sandbox.chmod(0o700)
          target = sandbox / (nonce + ".txt")
          flags = os.O_CREAT | os.O_EXCL | os.O_WRONLY
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          blob = ("ROVOR Mac execution proof\n" + nonce + "\n").encode("utf-8")
          fd = os.open(str(target), flags, 0o600)
          with os.fdopen(fd, "wb") as out:
              out.write(blob)
              out.flush()
              os.fsync(out.fileno())
          observed = target.read_bytes()
          if observed != blob:
              raise SystemExit("FAIL: written sandbox file readback mismatch")
          print("ROVOR_MAC_EXECUTION_PROOF " + json.dumps({
              "verified": True,
              "execution": "github-self-hosted-runner",
              "platform": platform.system(),
              "architecture": platform.machine(),
              "sandbox_file": target.name,
              "sha256": hashlib.sha256(observed).hexdigest(),
              "bytes": len(observed),
              "gui_control_verified": False,
              "open_interpreter_control_verified": False,
          }, sort_keys=True))
          PY
