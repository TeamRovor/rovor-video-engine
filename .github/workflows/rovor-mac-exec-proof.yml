name: Rovor Owned-Mac Restricted Execution Proof

# One harmless, main-branch, allowlisted Mac sandbox write/readback.
# No arbitrary shell from task input, GUI, model, user media or credentials.
on:
  push:
    branches: [main]
    paths:
      - 'rovor-production/mac-queue/exec-smoke-*.json'

permissions:
  contents: read

concurrency:
  group: rovor-owned-mac-exec-proof
  cancel-in-progress: false

jobs:
  sandbox-proof:
    if: github.repository == 'TeamRovor/rovor-video-engine'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 4
    steps:
      - name: Write and read back a new private sandbox proof file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import re
          import urllib.parse
          import urllib.request

          repo = "TeamRovor/rovor-video-engine"
          expected_path = "rovor-production/mac-queue/exec-smoke-20261022-01.json"
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]

          def github_get(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=18) as response:
                  return json.load(response)

          change = github_get("https://api.github.com/repos/" + repo + "/commits/" + sha)
          requests = [
              f["filename"] for f in change.get("files", [])
              if f.get("status") in ("added", "modified")
              and f.get("filename", "").startswith("rovor-production/mac-queue/exec-smoke-")
              and f.get("filename", "").endswith(".json")
          ]
          if requests != [expected_path]:
              raise SystemExit("REFUSED: commit does not contain exactly the expected one-time request")
          url = ("https://api.github.com/repos/" + repo + "/contents/"
                 + urllib.parse.quote(expected_path, safe="/") + "?ref=" + sha)
          fetched = github_get(url)
          if fetched.get("encoding") != "base64":
              raise SystemExit("REFUSED: unexpected request encoding")
          task = json.loads(base64.b64decode(fetched["content"]))
          if task != {
              "version": 1,
              "action": "sandbox.write_readback",
              "id": "mac-link-20261022-01",
          }:
              raise SystemExit("REFUSED: request outside fixed harmless operation")
          nonce = task["id"]
          if not re.fullmatch(r"[a-z0-9-]{6,60}", nonce):
              raise SystemExit("REFUSED: invalid proof identifier")
          if platform.system() != "Darwin":
              raise SystemExit("REFUSED: worker is not macOS")
          base = pathlib.Path.home() / "Documents" / "Rovor"
          if base.is_symlink() or not base.is_dir():
              raise SystemExit("REFUSED: expected Rovor workspace missing or redirected")
          sandbox = base / "ChatGPT-Link-Proof"
          if sandbox.is_symlink():
              raise SystemExit("REFUSED: sandbox is a symlink")
          sandbox.mkdir(mode=0o700, exist_ok=True)
          if sandbox.is_symlink() or not sandbox.is_dir():
              raise SystemExit("REFUSED: unsafe sandbox directory")
          sandbox.chmod(0o700)
          target = sandbox / (nonce + ".txt")
          flags = os.O_CREAT | os.O_EXCL | os.O_WRONLY
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          blob = ("ROVOR Mac execution proof\n" + nonce + "\n").encode("utf-8")
          fd = os.open(str(target), flags, 0o600)
          with os.fdopen(fd, "wb") as out:
              out.write(blob)
              out.flush()
              os.fsync(out.fileno())
          observed = target.read_bytes()
          if observed != blob:
              raise SystemExit("FAIL: written sandbox file readback mismatch")
          print("ROVOR_MAC_EXECUTION_PROOF " + json.dumps({
              "verified": True,
              "execution": "github-self-hosted-runner",
              "platform": platform.system(),
              "architecture": platform.machine(),
              "sandbox_file": target.name,
              "sha256": hashlib.sha256(observed).hexdigest(),
              "bytes": len(observed),
              "gui_control_verified": False,
              "open_interpreter_control_verified": False,
          }, sort_keys=True))
          PY
