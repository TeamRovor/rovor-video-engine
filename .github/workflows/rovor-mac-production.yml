      - name: Verify source narration preservation and controlled score/event mix
        shell: bash
        run: |
          set -Eeuo pipefail
          py="$HOME/Desktop/ROVOR_Evan_Full_Verified/venv/bin/python3"
          test -x "$py"
          cd "$GITHUB_WORKSPACE/_rovor_audio_mix_$GITHUB_RUN_ID/rovor-production"
          "$py" -m py_compile mix_audio_review.py test_mix_audio_review.py
          "$py" -m unittest test_mix_audio_review -v
          echo "SOURCE_NARRATION_WRITES=NONE"
          echo "LONGFORM_MIXER_SMOKE=PASS"
          echo "NO_PRIVATE_NARRATION_UPLOADED=YES"
