          assert catalog['approvedForAutomatedPublishing'] is False
          print('ORIGINAL_AUDIO_CHOICES_REGISTERED=YES')
          PY
          test -d "$HOME/Movies/RovorProduction/AudioLibrary/SoundEffects"
          test -d "$HOME/Movies/RovorProduction/AudioLibrary/BackgroundMusic"
          test -f "$HOME/Movies/RovorProduction/AudioLibrary/catalog.json"
