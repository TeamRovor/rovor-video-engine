name: Rovor Mac approved production

# Only trusted, explicitly approved requests on this one development branch.
# No pull_request trigger, no actions/checkout, no GitHub artifacts, no secrets.
on:
  push:
    branches:
      - development/evan-1080p60-acting-77a9561
    paths:
      - .github/rovor-mac-request.txt

permissions: {}

concurrency:
  group: rovor-private-mac-video-production
  cancel-in-progress: false

jobs:
  cinematic-scene-director-test:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor cinematic scene director test'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout preserved original Evan layered rig
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: _rovor_directed_scenes_${{ github.run_id }}
      - name: Test physical camera/prop motion and source-art rendering
        shell: bash
        run: |
          set -Eeuo pipefail
          py="$HOME/Desktop/ROVOR_Evan_Full_Verified/venv/bin/python3"
          plan="$HOME/Documents/Codex/2026-10-16/referenced-chatgpt-conversation-this-is-an-2/work/speech-alignment-v4/speech-plan.json"
          test -x "$py" && test -s "$plan"
          cd "$GITHUB_WORKSPACE/_rovor_directed_scenes_$GITHUB_RUN_ID/evan-engine"
          "$py" -m py_compile directed_scene.py render_acting_video.py
          "$py" -m unittest -v test_directed_scene test_visible_sound_sync
          "$py" -m py_compile visible_sound_sync.py
          "$py" - "$plan" <<'PY'
          import json,sys,tempfile
          import numpy as np
          from pathlib import Path
          from cartoon_body import CartoonBody,REVIEW_BODY_OPTIONS,narration_acting
          from directed_scene import DirectedScene
          from test_directed_scene import fixture
          voiceplan=json.load(open(sys.argv[1]))
          actual=CartoonBody(**REVIEW_BODY_OPTIONS).render(2.0,voiceplan,narration_acting(2.0))
          assert actual.mode=='RGBA' and actual.size==(1464,1536)
          with tempfile.TemporaryDirectory() as d:
              scene,registry=fixture(Path(d))
              from render_acting_video import _directed_worker_runtime
              sj=Path(d)/'scene.json';rj=Path(d)/'assets.json'
              sj.write_text(json.dumps(scene));rj.write_text(json.dumps(registry))
              paired,shared_actor=_directed_worker_runtime(str(sj),str(rj))
              paired_second,actor_second=_directed_worker_runtime(str(sj),str(rj))
              assert paired is paired_second and shared_actor is actor_second
              assert paired[0].images is paired[1].images
              assert _directed_worker_runtime.cache_info().hits>=1
              print('ORIGINAL_ASSETS_REUSED_BETWEEN_RENDER_CHUNKS=PASS')
              for portrait,size in ((False,(1920,1080)),(True,(1080,1920))):
                  compositor=paired[1 if portrait else 0]
                  a=np.asarray(compositor.frame(0,actual))
                  b=np.asarray(compositor.frame(200,actual))
                  difference=float(np.mean(abs(a.astype(np.int16)-b.astype(np.int16))))
                  assert difference>.25,("Physical movement invisible",portrait,difference)
                  assert a.shape[:2]==(size[1],size[0])
                  print("ORIGINAL_EVAN_DIRECTED_COMPOSITING_"+("PORTRAIT" if portrait else "LANDSCAPE")+"=PASS")
                  print("REAL_SCENE_MEAN_MOVEMENT="+str(round(difference,3)))
          print("STUDIO_ART_APPROVAL=NO")
          PY

  original-evan-performance-test:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor performance track test'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout original source art and authored performance engine
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: _rovor_performance_${{ github.run_id }}
      - name: Validate actual Evan rig actuation across long narration timeline
        shell: bash
        run: |
          set -Eeuo pipefail
          py="$HOME/Desktop/ROVOR_Evan_Full_Verified/venv/bin/python3"
          plan="$HOME/Documents/Codex/2026-10-16/referenced-chatgpt-conversation-this-is-an-2/work/speech-alignment-v4/speech-plan.json"
          test -x "$py" && test -f "$plan"
          cd "$GITHUB_WORKSPACE/_rovor_performance_$GITHUB_RUN_ID/evan-engine"
          "$py" -m unittest -v test_performance_tracks
          "$py" -m py_compile performance_tracks.py render_acting_video.py
          "$py" - "$plan" <<'PY'
          import json,sys,math
          import numpy as np
          from cartoon_body import CartoonBody,REVIEW_BODY_OPTIONS
          from performance_tracks import EvanPerformance
          from test_performance_tracks import authored
          source=json.load(open(sys.argv[1]))
          actor=EvanPerformance(authored())
          rig=CartoonBody(**REVIEW_BODY_OPTIONS)
          before=rig.render(2.0,source,actor.at_frame(0))
          after=rig.render(2.0,source,actor.at_frame(120))
          p=np.asarray(before).astype(np.int16)
          q=np.asarray(after).astype(np.int16)
          difference=float(np.mean(np.abs(p-q)))
          assert difference>0.15, 'Original rig did not visibly respond to acting controls'
          assert before.size==(1464,1536) and after.size==(1464,1536)
          assert actor.end==30473
          print('ORIGINAL_LAYERED_EVAN_ACTUATOR_RENDER=VERIFIED')
          print('BODY_IMAGE_MEAN_ABSOLUTE_CHANGE='+str(round(difference,3)))
          print('LONGFORM_SOURCE_AUDIO_FRAMES=30473')
          print('PUBLISH_APPROVAL=NO')
          PY

