          test -f "$HOME/Desktop/Rovor_Evan_Mac_Render_Kit/development/EVOLUTION-PASS2-CHECKPOINT.md"

      - name: Apply exact Python 3.9 verifier compatibility fix to kit copies only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          home = Path.home()
          old = "hashlib.file_digest(f,'sha256').hexdigest()"
          new = "hashlib.sha256(f.read()).hexdigest()"
          for path in (
              home / "Desktop/Rovor_Evan_Mac_Render_Kit/development/evan-engine/verify_review_video.py",
              home / "Desktop/ROVOR_Evan_Full_Verified/development/evan-engine/verify_review_video.py",
          ):
              if path.is_file():
                  current = path.read_text()
                  if old in current:
                      path.write_text(current.replace(old, new))
          print("PYTHON39_VERIFIER_COMPATIBILITY=CHECKED")
          PY

      - name: Render 22-second landscape and portrait with original layered rig
        shell: bash
        env:
          ROVOR_WORKERS: "3"
        run: |
          set -Eeuo pipefail
          bash "$HOME/Desktop/Rovor_Evan_Mac_Render_Kit/run_mac.sh"
          out="$HOME/Desktop/ROVOR_Evan_Full_Verified"
