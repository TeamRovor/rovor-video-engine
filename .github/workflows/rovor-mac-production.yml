name: Rovor Mac approved production

# Only trusted, explicitly approved requests on this one development branch.
# No pull_request trigger, no actions/checkout, no GitHub artifacts, no secrets.
on:
  push:
    branches:
      - development/evan-1080p60-acting-77a9561
    paths:
      - .github/rovor-mac-request.txt

permissions: {}

concurrency:
  group: rovor-private-mac-video-production
  cancel-in-progress: false

jobs:
  visual-qa:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor visual QA'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout read-only quality diagnostic
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rovor-production/visual_dynamics_audit.py
            rovor-production/test_visual_dynamics_audit.py
          sparse-checkout-cone-mode: false
      - name: Check visual-storyboarding gate against original baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          py="$HOME/Desktop/ROVOR_Evan_Full_Verified/venv/bin/python3"
          test -x "$py"
          (cd rovor-production && "$py" -m unittest test_visual_dynamics_audit -q)
          original="$HOME/Documents/Codex/2026-10-17/new-chat/outputs/Evan_Evolution_1080p60_Landscape.mp4"
          test -s "$original"
          "$py" rovor-production/visual_dynamics_audit.py "$original" --report "$RUNNER_TEMP/rovor-visual-audit.json"
          "$py" - "$RUNNER_TEMP/rovor-visual-audit.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report['status']=='VISUAL_REVIEW_REQUIRED',report
          assert report['publicationApproved'] is False
          print('BASELINE_VISUAL_QUALITY_REQUIRES_REDESIGN=YES')
          print('SUBSTANTIAL_SCENE_CHANGES='+str(report['substantialChanges']))
          PY

  deliver-existing-review:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor deliver existing review'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check whether both 22-second development reviews have already passed verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path.home()/'Desktop/ROVOR_Evan_Full_Verified'
          for label,orientation in (('Landscape','landscape'),('Portrait','portrait')):
              p=root/('Evan_Verified_Development_1080p60_'+label+'.mp4')
              report=root/('final-'+orientation+'.json')
              if not p.is_file() or not report.is_file():
                  raise SystemExit('NO_NEW_VERIFIED_OUTPUT_AVAILABLE='+label)
              with p.open('rb') as f:
                  h=hashlib.sha256()
                  for part in iter(lambda:f.read(1048576),b''):h.update(part)
              obj=json.loads(report.read_text())
              assert obj.get('videoSha256')==h.hexdigest(), 'Hash mismatch '+label
              assert obj.get('fps')==60 and obj.get('decodedFrames')==1323, 'Cadence '+label
              assert obj.get('continuousTimestamps') is True, 'Timestamp gap '+label
              assert obj.get('dimensions')==([1920,1080] if label=='Landscape' else [1080,1920]), 'Geometry '+label
              assert obj.get('referenceCorrelation',0)>=.98 and abs(obj.get('offsetSamples',999))<=32, 'Audio mismatch '+label
              print('EXISTING_VERIFIED_VIDEO_READY='+label)
          PY
      - name: Send finished existing review to private chat relay
        uses: actions/upload-artifact@v4
        with:
          name: Rovor-Evan-existing-verified-review-${{ github.run_id }}
          path: |
            /Users/amarhavic/Desktop/ROVOR_Evan_Full_Verified/Evan_Verified_Development_1080p60_Landscape.mp4
            /Users/amarhavic/Desktop/ROVOR_Evan_Full_Verified/Evan_Verified_Development_1080p60_Portrait.mp4
            /Users/amarhavic/Desktop/ROVOR_Evan_Full_Verified/final-landscape.json
            /Users/amarhavic/Desktop/ROVOR_Evan_Full_Verified/final-portrait.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  storyboard-preview:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor storyboard preview'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout original Evan rig with opt-in storyboard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate twelve genuine original-layered-animation keyframes
        shell: bash
        run: |
          set -Eeuo pipefail
          py="$HOME/Desktop/ROVOR_Evan_Full_Verified/venv/bin/python3"
          plan="$HOME/Documents/Codex/2026-10-16/referenced-chatgpt-conversation-this-is-an-2/work/speech-alignment-v4/speech-plan.json"
          test -f "$plan" && test -x "$py"
          cd evan-engine
          "$py" -m unittest -v test_storyboard_favicon
          mkdir -p "$RUNNER_TEMP/rovor-storyboard-preview"
          "$py" storyboard_favicon.py "$plan" "$RUNNER_TEMP/rovor-storyboard-preview"
          "$py" storyboard_favicon.py "$plan" "$RUNNER_TEMP/rovor-storyboard-preview" --vertical
          "$py" - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os,numpy as np
          folder=Path(os.environ["RUNNER_TEMP"])/"rovor-storyboard-preview"
          for layout,size in (("landscape",(1920,1080)),("portrait",(1080,1920))):
              paths=sorted(folder.glob("*-"+layout+".jpg"))
              assert len(paths)==6,(layout,len(paths))
              frames=[]
              for path in paths:
                  with Image.open(path) as im:
                      assert im.size==size,(path,im.size)
                      frames.append(np.array(im.resize((320,180)),dtype=np.int16))
              diffs=[float(np.abs(frames[i]-frames[i-1]).mean()) for i in range(1,6)]
              assert min(diffs)>8,(layout,diffs)
              print("SIX_DISTINCT_ORIGINAL_RIG_STORY_SHOTS_"+layout.upper()+"=YES")
          PY
      - name: Relay compact preview gallery to this chat
        uses: actions/upload-artifact@v4
        with:
          name: Rovor-Storyboard-Keyframes-${{ github.run_id }}
          path: ${{ runner.temp }}/rovor-storyboard-preview/
          if-no-files-found: error
          retention-days: 1

  chat-delivery-smoke:
    # Private, short-lived GH Actions artifact; only manually approved Rovor commit.
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor chat delivery smoke'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify existing reference MP4s and prepare private review copy
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$HOME/Documents/Codex/2026-10-17/new-chat/outputs"
          target="$RUNNER_TEMP/rovor-chat-smoke"
          mkdir -p "$target"
          a="$root/Evan_Evolution_1080p60_Landscape.mp4"
          b="$root/Evan_Evolution_1080p60_Portrait.mp4"
          test -s "$a" && test -s "$b"
          actual_a="$(shasum -a 256 "$a" | awk '{print $1}')"
          actual_b="$(shasum -a 256 "$b" | awk '{print $1}')"
          test "$actual_a" = "44e54a2c5efcdc33e053b6c9b2d0398805711cf206bff6d3e150d20e346cb6e8"
          test "$actual_b" = "6b5f4a2324012db46215d1cd47a18584ebbf93f53d0a4803299f116dbc612f7d"
          cp "$a" "$b" "$target/"
          printf 'REFERENCE_NOT_NEW_RENDER=YES\nLANDSCAPE_SHA256=%s\nPORTRAIT_SHA256=%s\n' "$actual_a" "$actual_b" > "$target/manifest.txt"
          echo "PRIVATE_CHAT_DELIVERY_TEST_FILES=VERIFIED"
      - name: Upload temporary private delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: rovor-reference-chat-delivery-${{ github.run_id }}
          path: ${{ runner.temp }}/rovor-chat-smoke/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  production-selftest:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor production selftest'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout non-media production utilities only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rovor-production
          sparse-checkout-cone-mode: false
      - name: Validate audio catalog, private delivery and editorial guard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile rovor-production/audio_intake.py rovor-production/private_delivery.py rovor-production/quality_gate.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'rovor-production')
          from quality_gate import audit
          assert not audit({"durationSec":60,"shots":[
            {"start":0,"end":60,"kind":"talking-head","visualPurpose":"Evan simply speaks to the audience","animatedActions":["small hand gesture"],"originalAssetIds":["Evan"],"composition":"locked"}
          ]})["valid"]
          kinds=["environment","action","visual-explainer","object-demo","metaphor","reaction","visual-explainer","action","visual-explainer","environment"]
          shots=[{"start":i*6,"end":(i+1)*6,"kind":kind,
                  "visualPurpose":"Illustrate a different narrated idea with original art",
                  "animatedActions":["object transformation","camera movement"],
                  "originalAssetIds":["evan",f"custom-{i}"],
                  "composition":"staged multi-plane shot"} for i,kind in enumerate(kinds)]
          report=audit({"durationSec":60,"shots":shots})
          assert report["valid"],report["problems"]
          assert not report["publicationApproved"]
          print("STORYBOARD_GATE_TEST=PASS")
          PY

  private-delivery:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor private delivery'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout only validated media-delivery utility
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rovor-production/private_delivery.py
          sparse-checkout-cone-mode: false
      - name: Copy verified 1080p60 reference videos into private Drive Desktop folder
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 rovor-production/private_delivery.py --label "Evan-22-second-review-$GITHUB_RUN_ID"
          echo 'GITHUB_MEDIA_ARTIFACT_UPLOADED=NO'

  audio-catalog:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor audio catalog'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout catalog script only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rovor-production/audio_intake.py
          sparse-checkout-cone-mode: false
      - name: Inventory local Rovor audio without uploading audio
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile rovor-production/audio_intake.py
          python3 rovor-production/audio_intake.py catalog
          echo 'CATALOG_STAYS_ON_MAC=YES'

  audio-analyze:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor audio analysis'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout fixed analysis runner and approved selection
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rovor-production/audio_intake.py
            .github/rovor-mac-request.txt
          sparse-checkout-cone-mode: false
      - name: Analyze only allowlisted recording ID
        shell: bash
        run: |
          set -Eeuo pipefail
          source_id="$(sed -n 's/^audio_id=//p' .github/rovor-mac-request.txt | head -1)"
          [[ "$source_id" =~ ^[0-9a-f]{16}$ ]] || { echo 'Invalid audio ID'; exit 1; }
          py="$HOME/Desktop/ROVOR_Evan_Full_Verified/venv/bin/python3"
          test -x "$py"
          "$py" -m py_compile rovor-production/audio_intake.py
          asr="$(sed -n 's/^asr=//p' .github/rovor-mac-request.txt | head -1)"
          case "$asr" in
            off) "$py" rovor-production/audio_intake.py analyze --id "$source_id" --no-asr ;;
            on)  "$py" rovor-production/audio_intake.py analyze --id "$source_id" ;;
            *) echo 'Invalid transcription mode'; exit 1 ;;
          esac
          echo 'NO_PRIVATE_MEDIA_UPLOADED=YES'

  capability-audit:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor capability audit'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 3
    steps:
      - name: Read-only installed-tool audit
        shell: bash
        run: |
          set -euo pipefail
          for exe in rclone whisper-cli whisper rhubarb ffmpeg ffprobe brew; do
            if command -v "$exe" >/dev/null 2>&1; then
              echo "TOOL_${exe}=PRESENT"
            else
              echo "TOOL_${exe}=NOT_ON_PATH"
            fi
          done
          base="$HOME/Documents/Codex"
          n="$(find "$base" -name local_tools.json -type f -maxdepth 10 2>/dev/null | wc -l | tr -d ' ')"
          echo "LOCAL_TOOL_CONFIG_COUNT=$n"
          echo "MACOS_VERSION=$(sw_vers -productVersion)"
          if test -d "/Applications/Google Drive.app"; then echo 'DRIVE_DESKTOP_APP_INSTALLED=YES'; else echo 'DRIVE_DESKTOP_APP_INSTALLED=NO'; fi
          python3 - <<'PY'
          import json, pathlib, glob, os
          configs=glob.glob(str(pathlib.Path.home()/"Documents/Codex/**/local_tools.json"), recursive=True)
          for k in ("ffmpeg","whisper","model","rhubarb","painted_python","painted_packages"):
              hits=0
              for name in configs[:20]:
                  try:
                      val=json.load(open(name)).get(k,"")
                      if val and pathlib.Path(str(val)).exists():hits+=1
                  except (OSError,ValueError,TypeError):pass
              print("CONFIG_%s_PRESENT=%s"%(k.upper(),int(hits>0)))
          cloud=pathlib.Path.home()/"Library/CloudStorage"
          providers=sorted(x.name.split("-")[0] for x in cloud.glob("GoogleDrive*")) if cloud.is_dir() else []
          print("GOOGLE_DRIVE_DESKTOP_MOUNT=%s"%("YES" if providers else "NO"))
          PY
          py="$HOME/Desktop/ROVOR_Evan_Full_Verified/venv/bin/python3"
          if test -x "$py"; then
            for module in pocketsphinx cmudict matplotlib numpy; do
              if "$py" -c "import $module" >/dev/null 2>&1; then
                echo "PYMODULE_${module}=PRESENT"
              else
                echo "PYMODULE_${module}=MISSING"
              fi
            done
          fi

  preflight:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor preflight'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 3
    steps:
      - name: Check approved Mac environment (no private media read)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = x86_64
          test -f "$HOME/Desktop/Rovor_Evan_Mac_Render_Kit/run_mac.sh"
          test -f "$HOME/Documents/Codex/2026-10-17/new-chat/work/rovor-video-engine/EVOLUTION-PASS2-CHECKPOINT.md"
          test -f "$HOME/Documents/Codex/2026-10-16/referenced-chatgpt-conversation-this-is-an/work/evan-narration.wav"
          test -f "$HOME/Documents/Codex/2026-10-16/referenced-chatgpt-conversation-this-is-an-2/work/speech-alignment-v4/speech-plan.json"
          test -x "$HOME/Documents/Codex/2026-10-16/referenced-chatgpt-conversation-this-is-an/work/media-tools/ffmpeg"
          test -f "/System/Library/Fonts/Helvetica.ttc"
          printf 'ROVOR_MAC_PREFLIGHT=PASS\n'
          printf 'EXPECTED_FORMATS=1920x1080_60fps,1080x1920_60fps\n'

  full-dual-format-render:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor full render'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 240
    steps:
      - name: Validate existing trusted local kit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = x86_64
          test -f "$HOME/Desktop/Rovor_Evan_Mac_Render_Kit/run_mac.sh"
          test -f "$HOME/Desktop/Rovor_Evan_Mac_Render_Kit/development/EVOLUTION-PASS2-CHECKPOINT.md"

      - name: Apply exact Python 3.9 verifier compatibility fix to kit copies only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          home = Path.home()
          old = "hashlib.file_digest(f,'sha256').hexdigest()"
          new = "hashlib.sha256(f.read()).hexdigest()"
          for path in (
              home / "Desktop/Rovor_Evan_Mac_Render_Kit/development/evan-engine/verify_review_video.py",
              home / "Desktop/ROVOR_Evan_Full_Verified/development/evan-engine/verify_review_video.py",
          ):
              if path.is_file():
                  current = path.read_text()
                  if old in current:
                      path.write_text(current.replace(old, new))
          print("PYTHON39_VERIFIER_COMPATIBILITY=CHECKED")
          PY

      - name: Render 22-second landscape and portrait with original layered rig
        shell: bash
        env:
          ROVOR_WORKERS: "3"
        run: |
          set -Eeuo pipefail
          bash "$HOME/Desktop/Rovor_Evan_Mac_Render_Kit/run_mac.sh"
          out="$HOME/Desktop/ROVOR_Evan_Full_Verified"
          test -s "$out/Evan_Verified_Development_1080p60_Landscape.mp4"
          test -s "$out/Evan_Verified_Development_1080p60_Portrait.mp4"
          test -s "$out/final-landscape.json"
          test -s "$out/final-portrait.json"
          echo 'ROVOR_FULL_1080P60_RENDER=VERIFIED'
          echo 'OUTPUT_STAYS_ON_MAC=YES'
          echo 'PRIVATE_MEDIA_NOT_COMMITTED_TO_REPOSITORY=YES'

      - name: Relay verified videos as short-lived private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rovor-Evan-development-review-${{ github.run_id }}
          path: |
            /Users/amarhavic/Desktop/ROVOR_Evan_Full_Verified/Evan_Verified_Development_1080p60_Landscape.mp4
            /Users/amarhavic/Desktop/ROVOR_Evan_Full_Verified/Evan_Verified_Development_1080p60_Portrait.mp4
            /Users/amarhavic/Desktop/ROVOR_Evan_Full_Verified/final-landscape.json
            /Users/amarhavic/Desktop/ROVOR_Evan_Full_Verified/final-portrait.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
