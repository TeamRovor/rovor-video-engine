  audio-analyze:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor audio analysis'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout fixed analysis runner and approved selection
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rovor-production/audio_intake.py
            .github/rovor-mac-request.txt
          sparse-checkout-cone-mode: false
      - name: Analyze only allowlisted recording ID
        shell: bash
        run: |
          set -Eeuo pipefail
          source_id="$(sed -n 's/^audio_id=//p' .github/rovor-mac-request.txt | head -1)"
          [[ "$source_id" =~ ^[0-9a-f]{16}$ ]] || { echo 'Invalid audio ID'; exit 1; }
          py="$HOME/Desktop/ROVOR_Evan_Full_Verified/venv/bin/python3"
          test -x "$py"
          "$py" -m py_compile rovor-production/audio_intake.py
          asr="$(sed -n 's/^asr=//p' .github/rovor-mac-request.txt | head -1)"
          case "$asr" in
            off) "$py" rovor-production/audio_intake.py analyze --id "$source_id" --no-asr ;;
            on)  "$py" rovor-production/audio_intake.py analyze --id "$source_id" ;;
            *) echo 'Invalid transcription mode'; exit 1 ;;
          esac
          echo 'NO_PRIVATE_MEDIA_UPLOADED=YES'

  capability-audit:
    if: github.actor == 'TeamRovor' && github.event.head_commit.message == 'Approved Rovor capability audit'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 3
    steps:
      - name: Read-only installed-tool audit
        shell: bash
        run: |
          set -euo pipefail
          for exe in rclone whisper-cli whisper rhubarb ffmpeg ffprobe brew; do
            if command -v "$exe" >/dev/null 2>&1; then
              echo "TOOL_${exe}=PRESENT"
            else
              echo "TOOL_${exe}=NOT_ON_PATH"
            fi
          done
          base="$HOME/Documents/Codex"
          n="$(find "$base" -name local_tools.json -type f -maxdepth 10 2>/dev/null | wc -l | tr -d ' ')"
          echo "LOCAL_TOOL_CONFIG_COUNT=$n"
          echo "MACOS_VERSION=$(sw_vers -productVersion)"
          if test -d "/Applications/Google Drive.app"; then echo 'DRIVE_DESKTOP_APP_INSTALLED=YES'; else echo 'DRIVE_DESKTOP_APP_INSTALLED=NO'; fi
          python3 - <<'PY'
          import json, pathlib, glob, os
          configs=glob.glob(str(pathlib.Path.home()/"Documents/Codex/**/local_tools.json"), recursive=True)
          for k in ("ffmpeg","whisper","model","rhubarb","painted_python","painted_packages"):
              hits=0
              for name in configs[:20]:
                  try:
                      val=json.load(open(name)).get(k,"")
                      if val and pathlib.Path(str(val)).exists():hits+=1
                  except (OSError,ValueError,TypeError):pass
              print("CONFIG_%s_PRESENT=%s"%(k.upper(),int(hits>0)))
          cloud=pathlib.Path.home()/"Library/CloudStorage"
          providers=sorted(x.name.split("-")[0] for x in cloud.glob("GoogleDrive*")) if cloud.is_dir() else []
          print("GOOGLE_DRIVE_DESKTOP_MOUNT=%s"%("YES" if providers else "NO"))
          PY
          py="$HOME/Desktop/ROVOR_Evan_Full_Verified/venv/bin/python3"
          if test -x "$py"; then
            for module in pocketsphinx cmudict matplotlib numpy; do
              if "$py" -c "import $module" >/dev/null 2>&1; then
                echo "PYMODULE_${module}=PRESENT"
              else
                echo "PYMODULE_${module}=MISSING"
              fi
            done
          fi

