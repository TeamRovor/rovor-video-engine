name: Deploy ROVOR Command Center to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/command-center/**"
      - ".github/workflows/deploy-command-center-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: command-center-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js for release checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Command Center before publishing
        run: |
          node --check dashboard/command-center/live-data.js
          node --check dashboard/command-center/reference-hud.js
          node --check dashboard/command-center/orbital-earth.js
          node --check dashboard/command-center/hud-experience.js
          node --check dashboard/command-center/app.js
          node --check dashboard/command-center/service-worker.js
          node --test dashboard/command-center/tests/live-data.test.js dashboard/command-center/tests/request-budget.test.js dashboard/command-center/tests/reference-hud.test.js dashboard/command-center/tests/hud-experience.test.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static Command Center
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/command-center

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
