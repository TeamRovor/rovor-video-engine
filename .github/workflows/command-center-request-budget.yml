name: ROVOR Command Center one-hour quota regression
on:
  pull_request:
    paths:
      - 'dashboard/command-center/**'
      - '.github/workflows/command-center-request-budget.yml'
permissions:
  contents: read
jobs:
  browser-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source Earth texture downloads
        run: bash dashboard/command-center/tools/prepare-earth-textures.sh
      - name: Verify exact-reference HUD syntax
        run: node --check dashboard/command-center/exact/app.js && node --check dashboard/command-center/exact/service-worker.js
      - name: Test actual browser script with mocked GitHub data for one hour
        run: node --check dashboard/command-center/orbital-earth.js && node --check dashboard/command-center/hud-experience.js && node --check dashboard/command-center/cinematic-layout.js && node --check dashboard/command-center/reference-hud.js && node --test dashboard/command-center/tests/request-budget.test.js dashboard/command-center/tests/reference-hud.test.js dashboard/command-center/tests/hud-experience.test.js dashboard/command-center/tests/cinematic-layout.test.js dashboard/command-center/tests/electric-blue-theme.test.js dashboard/command-center/exact/tests/exact-hud.test.cjs dashboard/command-center/tests/exact-reference.test.js dashboard/command-center/tests/exact-hud.test.cjs
