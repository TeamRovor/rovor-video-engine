name: ROVOR Command Center API budget QA
on:
  pull_request:
    paths:
      - 'dashboard/command-center/**'
      - '.github/workflows/command-center-request-budget.yml'
      - 'reviews/command-center-request-budget-qa-20261023.md'
permissions:
  contents: read
jobs:
  command-center-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Command Center JavaScript syntax
        run: |
          node --check dashboard/command-center/live-data.js
          node --check dashboard/command-center/app.js
      - name: Simulate one hour of actual Command Center polling
        run: node --test dashboard/command-center/tests/request-budget.test.js
