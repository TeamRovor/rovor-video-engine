name: ROVOR cloud refill batch admission
on:
  pull_request:
    paths:
      - 'coordination/tasks.json'
      - 'coordination/work-routing.json'
      - 'tests/test_ghost_cloud_refill_batch.mjs'
      - '.github/workflows/ghost-cloud-refill-batch.yml'
  push:
    branches: [main]
    paths:
      - 'coordination/tasks.json'
      - 'coordination/work-routing.json'
      - 'tests/test_ghost_cloud_refill_batch.mjs'
      - '.github/workflows/ghost-cloud-refill-batch.yml'
concurrency:
  group: ghost-cloud-refill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline-next-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_ghost_cloud_feed.mjs tests/test_ghost_cloud_refill_batch.mjs
