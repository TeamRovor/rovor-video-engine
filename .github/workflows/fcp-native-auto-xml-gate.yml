name: Jane zero-menu native import XML gate
on:
  pull_request:
    paths:
      - 'tools/fcp_native_auto_import.py'
      - 'tests/test_fcp_native_auto_import.py'
      - '.github/workflows/fcp-native-auto-xml-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  valid-apple-target-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real Apple FCPXML DTD on both automatic library targets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libxml2-utils
          fi
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          curl -fL --retry 2 --max-time 45 \
            'https://raw.githubusercontent.com/andrewarrow/cutlass/main/FCPXMLv1_13.dtd' \
            -o "$WORK/FCPXMLv1_13.dtd"
          test "$(sha256sum "$WORK/FCPXMLv1_13.dtd" | awk '{print $1}')" \
            = '5afbc7ca1001bbc2190fb3b21d4d440ce061d94f5a5f583074e982b4745cd04d'
          export WORK
          python3 - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          from unittest import mock
          sys.path.insert(0,'tools')
          from fcp_native_import_candidate import create_candidate
          import fcp_native_auto_import as jane
          root=Path(os.environ['WORK'])
          home=root/'user'
          base=home/'Documents'/'Rovor'
          base.mkdir(parents=True)
          inp=base/'verified-candidates'
          inp.mkdir()
          sha={}
          for label,w,h in jane.LABELS:
              p=inp/f'ROVOR-NATIVE-IMPORT-{label}-30s-60fps.fcpxml'
              create_candidate(p,int(w),int(h),label)
              sha[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          (inp/'native-candidate-receipt.json').write_text(json.dumps({
              'status':'candidate_prepared_native_not_imported',
              'duration_seconds':30,'frame_rate':60,
              'referenced_media_files':0,'native_final_cut_operated':False,
              'fcpxml_sha256':sha
          }))
          with mock.patch.object(Path,'home',return_value=home):
              receipt=jane.prepare(inp,base/'native-result',root/'FCPXMLv1_13.dtd')
          assert receipt['status']=='ready_to_dispatch_not_launched'
          assert receipt['apple_event_sent'] is False
          assert receipt['native_timeline_verified'] is False
          assert not Path(receipt['target_library']).exists()
          print('PASS: real FCPXML 1.13 DTD validated both 30s/60fps library-targeted XMLs.')
          PY
