name: Rovor Mac connection check

# Safe, narrowly scoped first test of the dedicated Rovor-Mac runner.
# Only a change to this workflow on the specified development branch triggers it.
# This workflow never checks out repository code or accesses narration and caches.
on:
  push:
    branches:
      - development/evan-1080p60-acting-77a9561
    paths:
      - .github/workflows/rovor-mac-connectivity.yml

permissions:
  contents: read

jobs:
  mac-connection-check:
    if: github.event.head_commit.message == 'Approved Rovor Mac connectivity check'
    runs-on: [self-hosted, macOS, X64, rovor-video]
    timeout-minutes: 2
    steps:
      - name: Read-only runner handshake
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          printf 'RUNNER_CONNECTED=YES\n'
          printf 'RUNNER_ARCH=%s\n' "$(uname -m)"
          printf 'PYTHON_PRESENT='
          if command -v python3 >/dev/null 2>&1; then echo YES; else echo NO; fi
          printf 'SOURCE_CHECKPOINT_PRESENT='
          if test -f "$HOME/Documents/Codex/2026-10-17/new-chat/work/rovor-video-engine/EVOLUTION-PASS2-CHECKPOINT.md"; then echo YES; else echo NO; fi
          printf 'LOCAL_RENDER_KIT_PRESENT='
          if test -f "$HOME/Desktop/Rovor_Evan_Mac_Render_Kit/run_mac.sh"; then echo YES; else echo NO; fi
