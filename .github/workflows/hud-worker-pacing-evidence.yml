name: HUD worker pacing evidence tests
on:
  pull_request:
    paths:
      - 'tools/hud_employee_snapshot.py'
      - 'dashboard/command-center/native-v8-9/live-quota-board.js'
      - 'tests/test_hud_worker_pacing.py'
      - 'tests/test_hud_live_quota_jobs.cjs'
      - '.github/workflows/hud-worker-pacing-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -p test_hud_worker_pacing.py -v
      - run: python -m unittest discover -s tests -p test_hud_employee_snapshot.py -v
      - run: node tests/test_hud_live_quota_jobs.cjs
