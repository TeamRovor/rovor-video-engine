name: Connect Google Gemini to existing ROVOR HUD

# CLOUD-ONLY. No self-hosted runner, Mac, OmniRoute localhost, Site replacement,
# provider-key exposure, background job or paid fallback.
on:
  workflow_dispatch:
    inputs:
      confirm_free_tier:
        type: boolean
        description: "I confirm my Google API key belongs to the Free-tier project (not a paid Gemini project)"
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: rovor-existing-hud-gemini-cloud-activation
  cancel-in-progress: false

jobs:
  cloud-tests:
    name: Verify cloud-only Google Gemini security and HUD compatibility
    if: github.repository == 'TeamRovor/rovor-video-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test direct Gemini API, D1 caps, private reader auth and existing HUD
        run: |
          set -euo pipefail
          node --check integrations/hud-cloud/worker.mjs
          node --check integrations/hud-cloud/cloud-gemini-chat.mjs
          node --check integrations/hud-cloud/verify-cloud-gemini.mjs
          node --check integrations/hud-cloud/build-sites.mjs
          node --check dashboard/command-center/native-v8-9/hud-chat.js
          node --test tests/test_hud_cloud_gemini.mjs tests/test_hud_cloud_chat.mjs tests/test_hud_cloud.mjs tests/test_hud_sites.mjs
          node tests/test_hud_chat_browser.cjs

  deploy-cloud:
    name: Deploy cloud Gemini to existing private ROVOR HUD (no Mac)
    needs: cloud-tests
    if: inputs.confirm_free_tier == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rovor-hud-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROVOR_HUD_D1_ID: ${{ secrets.ROVOR_HUD_D1_ID }}
      ROVOR_HUD_WRITER_TOKEN: ${{ secrets.ROVOR_HUD_WRITER_TOKEN }}
      ROVOR_HUD_READER_TOKEN: ${{ secrets.ROVOR_HUD_READER_TOKEN }}
      ROVOR_HUD_DEPLOY_ORIGIN: ${{ vars.ROVOR_HUD_DEPLOY_ORIGIN }}
      ROVOR_GEMINI_CLOUD_API_KEY: ${{ secrets.ROVOR_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: integrations/hud-cloud
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm existing Cloudflare deployment and Google cloud secret are available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ROVOR_GEMINI_CLOUD_API_KEY:-}" ]; then
            echo "::error::Google Gemini API key is not available in the existing GitHub environment. Add ROVOR_GEMINI_API_KEY (or GEMINI_API_KEY) as a repository/environment Actions secret, using your Google Free-tier project key. Do not paste keys into chat or GitHub source."
            exit 1
          fi
          node prepare-github-deploy.mjs
          echo "Trusted main, existing private HUD and free-tier owner approval confirmed."
      - name: Install pinned major Wrangler for existing Cloudflare Worker
        run: npm install --global wrangler@4
      - name: Add only new forward-only Gemini D1 budget tables to existing private DB
        run: wrangler d1 execute DB --remote --file=schema.sql --config wrangler.github.jsonc
      - name: Deploy existing HUD with cloud Gemini route, keeping original auth and design
        run: wrangler deploy --config wrangler.github.jsonc
      - name: Set existing private HUD secrets and cloud Gemini secret without logging values
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const e=process.env;process.stdout.write(JSON.stringify({HUD_WRITER_TOKEN:e.ROVOR_HUD_WRITER_TOKEN,HUD_READER_TOKEN:e.ROVOR_HUD_READER_TOKEN,GEMINI_API_KEY:e.ROVOR_GEMINI_CLOUD_API_KEY,ROVOR_GEMINI_FREE_TIER_VERIFIED:"confirmed"}))' |
            wrangler secret bulk --config wrangler.github.jsonc
      - name: Verify actual Google Gemini cloud answer and private D1 receipt (one canary)
        run: node verify-cloud-gemini.mjs
      - name: Report verified Mac-independent success
        run: |
          echo "Gemini cloud route completed one live answer in existing ROVOR HUD."
          echo "No Mac runner or local OmniRoute gateway was involved. Free-tier account verification must remain current."
