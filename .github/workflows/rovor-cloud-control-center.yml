name: ROVOR Cloud Control Center - audit deploy and verify

# Audit/diagnostic ONLY. This older control center must never deploy or
# reset the production Cloudflare Worker and its owner/GitHub-App secrets.
# The SOLE deploy owner is deploy-private-hud-cloudflare.yml (protected main
# workflow_dispatch / push with exact source and live private readback).
# No Mac, paid inference, STOP bypass, secret logs, or automatic PASS/FAIL.
on:
  pull_request:
    paths:
      - '.github/workflows/rovor-cloud-control-center.yml'
      - 'tools/rovor_cloud_control_report.py'
      - 'tests/test_rovor_cloud_control_report.py'
      - 'tools/verify_rovor_provider_catalog_readback.py'
      - 'tests/test_rovor_provider_catalog_readback.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rovor-cloud-control-center.yml'
      - 'tools/rovor_cloud_control_report.py'
      - 'tests/test_rovor_cloud_control_report.py'
      - 'tools/verify_rovor_provider_catalog_readback.py'
      - 'tests/test_rovor_provider_catalog_readback.py'
  workflow_dispatch:
    inputs:
      verify_provider_catalog_readback:
        description: "Check all nine provider catalogs and confirm private Site D1 persisted the checks; no inference"
        type: boolean
        required: false
        default: false
      run_mode:
        description: "Audit ONLY. For production use GitHub-owned PRIVATE ROVOR HUD (Cloudflare Worker) workflow"
        type: choice
        required: true
        default: audit_only
        options:
          - audit_only
      trigger_one_approved_shift:
        description: "LEGACY Site diagnostic only (may HTTP 403), NOT the native Cloudflare workforce"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: rovor-cloud-control-center
  cancel-in-progress: false

jobs:
  offline-safety:
    name: Verify source, queue, cloud admission and private HUD contracts
    if: github.repository == 'TeamRovor/rovor-video-engine' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate cloud-only runner and source syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/rovor_cloud_control_report.py
          node --check integrations/hud-cloud/worker.mjs
          node --check integrations/hud-cloud/cloud-gemini-chat.mjs
          node --check integrations/hud-cloud/verify-cloud-gemini.mjs
          node --check integrations/ghost-cloud/site-operations.mjs
          node --check integrations/ghost-cloud/scheduled-shift.mjs
          node --check dashboard/command-center/native-v8-9/hud-chat.js
          bash -n tools/install_hud_chat_relay.sh
      - name: Verify existing private HUD security and cloud runtime admission
        run: |
          set -euo pipefail
          node --test tests/test_hud_cloud_gemini.mjs tests/test_hud_cloud.mjs tests/test_hud_cloud_chat.mjs tests/test_hud_chat_mobile.mjs tests/test_ghost_cloud.mjs tests/test_ghost_cloud_canary_preflight.mjs tests/test_ghost_cloud_operations.mjs tests/test_ghost_cloud_scheduled_shift.mjs
          python3 -m unittest discover -s tests -p test_ghost_cloud_hosted_shift.py -v
          python3 -m unittest discover -s tests -p test_rovor_cloud_control_report.py -v
          python3 -m unittest discover -s tests -p test_rovor_provider_catalog_readback.py -v
          node tests/test_hud_chat_browser.cjs
      - name: Verify one canonical owner/role/task routing queue
        run: |
          set -euo pipefail
          python3 tools/project_loop.py check
          python3 tools/task_routing_pair.py --check

  cloud-readiness:
    name: Read legacy Site and Cloudflare HUD status; no deployment or model request
    needs: offline-safety
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: rovor-hud-production
    outputs:
      deploy_ready: ${{ steps.audit.outputs.deploy_ready }}
      site_accessible: ${{ steps.audit.outputs.site_accessible }}
      shift_ready: ${{ steps.audit.outputs.shift_ready }}
    env:
      ROVOR_CONTROL_MODE: ${{ inputs.run_mode }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROVOR_HUD_D1_ID: ${{ secrets.ROVOR_HUD_D1_ID }}
      ROVOR_HUD_WRITER_TOKEN: ${{ secrets.ROVOR_HUD_WRITER_TOKEN }}
      ROVOR_HUD_READER_TOKEN: ${{ secrets.ROVOR_HUD_READER_TOKEN }}
      ROVOR_HUD_DEPLOY_ORIGIN: ${{ vars.ROVOR_HUD_DEPLOY_ORIGIN }}
      ROVOR_GEMINI_API_KEY: ${{ secrets.ROVOR_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
      ROVOR_GHOST_SERVICE_TOKEN: ${{ secrets.ROVOR_GHOST_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Private, read-only check of two existing cloud systems
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          export ROVOR_REPORT_OUTPUT="$RUNNER_TEMP/rovor-cloud-readiness.json"
          python3 tools/rovor_cloud_control_report.py
      - name: Link the protected production deployment workflow
        shell: bash
        run: |
          echo "### Audit only — no deployment or inference" >> "$GITHUB_STEP_SUMMARY"
          echo "For the existing production Worker, run the protected workflow:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/TeamRovor/rovor-video-engine/actions/workflows/deploy-private-hud-cloudflare.yml" >> "$GITHUB_STEP_SUMMARY"
          echo "This legacy entry point does not deploy, rotate secrets, publish a Site or dispatch an AI model." >> "$GITHUB_STEP_SUMMARY"
      - name: Save sanitized readiness report (no secrets, no prompts)
        uses: actions/upload-artifact@v4
        with:
          name: rovor-cloud-readiness
          path: ${{ runner.temp }}/rovor-cloud-readiness.json
          retention-days: 7
          if-no-files-found: error

  provider-catalog-readback:
    name: Verify nine cloud provider catalog checks persist in existing private Site
    # On a reviewed main-branch change this audit runs unattended. PRs never
    # receive production credentials; manual dispatch remains separately opt-in.
    if: github.event_name == 'workflow_dispatch' && inputs.verify_provider_catalog_readback == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: rovor-hud-production
    env:
      ROVOR_GHOST_SERVICE_TOKEN: ${{ secrets.ROVOR_GHOST_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read nine fixed provider catalogs and verify persisted checks
        env:
          ROVOR_CATALOG_REPORT_OUTPUT: ${{ runner.temp }}/rovor-provider-catalog-readback.json
        run: python3 tools/verify_rovor_provider_catalog_readback.py
      - name: Preserve only sanitized proof, without models or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rovor-nine-provider-catalog-readback
          path: ${{ runner.temp }}/rovor-provider-catalog-readback.json
          retention-days: 7
          if-no-files-found: warn

  one-approved-cloud-shift:
    name: Optional manual legacy Site shift diagnostic (NOT production cron)
    needs: cloud-readiness
    if: inputs.trigger_one_approved_shift == true && needs.cloud-readiness.outputs.shift_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: rovor-hud-production
    concurrency:
      group: rovor-cloud-hosted-shift
      cancel-in-progress: false
    env:
      ROVOR_GHOST_SERVICE_TOKEN: ${{ secrets.ROVOR_GHOST_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Request exactly one guarded existing private Site shift
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ghost_cloud_hosted_shift.py
          echo "One privately admitted cloud shift request was processed. A zero-dispatch result is NOT AI activity proof." >> "$GITHUB_STEP_SUMMARY"

  unavailable-cloud-shift:
    name: Explain why requested cloud shift was not attempted
    needs: cloud-readiness
    if: inputs.trigger_one_approved_shift == true && needs.cloud-readiness.outputs.shift_ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on STOP, provider admission or Site service auth
        run: |
          echo "::warning title=Cloud shift not eligible::Existing private Site service is unavailable, STOP is active, or no cloud provider is currently verified eligible. Nothing was dispatched."
          echo "### Cloud shift not executed" >> "$GITHUB_STEP_SUMMARY"
          echo "The read-only readiness report identifies the Site reachability/STOP/provider admission blocker. No failed job was replayed." >> "$GITHUB_STEP_SUMMARY"

  final-readback:
    name: Recheck legacy read-only HUD, provider, activity and review evidence
    needs: [cloud-readiness, one-approved-cloud-shift, unavailable-cloud-shift]
    if: always() && needs.cloud-readiness.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: rovor-hud-production
    env:
      ROVOR_CONTROL_MODE: ${{ inputs.run_mode }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROVOR_HUD_D1_ID: ${{ secrets.ROVOR_HUD_D1_ID }}
      ROVOR_HUD_WRITER_TOKEN: ${{ secrets.ROVOR_HUD_WRITER_TOKEN }}
      ROVOR_HUD_READER_TOKEN: ${{ secrets.ROVOR_HUD_READER_TOKEN }}
      ROVOR_HUD_DEPLOY_ORIGIN: ${{ vars.ROVOR_HUD_DEPLOY_ORIGIN }}
      ROVOR_GEMINI_API_KEY: ${{ secrets.ROVOR_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
      ROVOR_GHOST_SERVICE_TOKEN: ${{ secrets.ROVOR_GHOST_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Final private read-only evidence (no inference or secret output)
        shell: bash
        run: |
          set -euo pipefail
          export ROVOR_REPORT_OUTPUT="$RUNNER_TEMP/rovor-cloud-final.json"
          python3 tools/rovor_cloud_control_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: rovor-cloud-final-readback
          path: ${{ runner.temp }}/rovor-cloud-final.json
          retention-days: 7
          if-no-files-found: error
